<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Control Portal</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #f5f5f7; }

    #app-container { position: relative; width: 100%; height: 100%; background: radial-gradient(circle at 50% 20%, #1c1c2e 0%, #0d0d14 60%, #000000 100%); display: flex; flex-direction: column; }
    #remote-video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; display: none; }
    #local-video-container { position: absolute; top: 24px; right: 20px; width: 115px; height: 170px; border-radius: 22px; overflow: hidden; z-index: 10; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.15); touch-action: none; background: rgba(28, 28, 46, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: none; }
    #local-video { width: 100%; height: 100%; object-fit: cover; }

    #teams-call-bar { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 5000; background: rgba(32, 31, 31, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 24px; padding: 12px 24px; display: none; align-items: center; gap: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.15); }
    .teams-call-btn { background: rgba(255,255,255,0.1); border: none; border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.2rem; cursor: pointer; transition: background 0.2s; }
    .teams-call-btn:hover { background: rgba(255,255,255,0.25); }
    .teams-call-btn.active { background: rgba(255,255,255,0.35); }
    .teams-call-btn.danger { background: #e81123; }
    .teams-call-btn.danger:hover { background: #f1707a; }

    .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3000; width: 88%; max-width: 380px; background: rgba(30, 30, 45, 0.95); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px); padding: 22px 20px; border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.18); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7); display: flex; flex-direction: column; gap: 12px; }
    .modal h3 { font-weight: 600; font-size: 1.1rem; text-align: center; color: #fff; }
    input, select { width: 100%; padding: 10px 14px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(0, 0, 0, 0.4); color: #fff; font-size: 0.88rem; outline: none; }
    .btn { padding: 12px; border-radius: 16px; border: none; background: linear-gradient(180deg, #0a84ff 0%, #0066cc 100%); color: #fff; font-weight: 600; font-size: 0.9rem; cursor: pointer; }

    .admin-bar { position: relative; z-index: 1000; display: flex; background: rgba(255, 69, 58, 0.15); border: 1px solid rgba(255, 69, 58, 0.3); backdrop-filter: blur(15px); border-radius: 18px; padding: 10px 14px; margin-bottom: 8px; align-items: center; justify-content: space-between; font-size: 0.8rem; }
    .status-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; margin-right: 4px; }
    .status-indicator.online { background: #30d158; }
    .settings-btn { background: rgba(255, 255, 255, 0.15) !important; color: #fff !important; padding: 6px 10px !important; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; border: none; }

    .settings-menu { position: absolute; top: 50px; right: 10px; z-index: 99999; background: rgba(25, 25, 38, 0.98); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 12px; display: none; flex-direction: column; gap: 8px; box-shadow: 0 16px 40px rgba(0,0,0,0.85); width: 220px; }
    .menu-item { padding: 10px 12px; border-radius: 12px; border: none; background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-align: center; }
    .menu-item:active { background: rgba(255, 255, 255, 0.25); }
    .menu-item.active-mode { background: linear-gradient(180deg, #30d158 0%, #248a3d 100%); }
    .menu-item.danger { background: linear-gradient(180deg, #ff453a 0%, #d70015 100%); }

    #log-modal, #sound-modal, #calllog-modal { display: none; z-index: 6000; max-height: 85vh; overflow-y: auto; }
    .log-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; max-height: 280px; overflow-y: auto; font-size: 0.82rem; font-family: monospace; padding-right: 4px; }
    .log-list::-webkit-scrollbar { width: 4px; }
    .log-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
    .log-entry { padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,0.06); border-left: 3px solid #ff3b30; word-break: break-word; }
    .log-entry.login { border-left-color: #30d158; color: #30d158; }
    .log-entry.logout { border-left-color: #ff3b30; color: #ff453a; }
    .calllog-entry { padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,0.06); border-left: 3px solid #0a84ff; word-break: break-word; font-size: 0.82rem; font-family: monospace; }
    .calllog-entry.missed { border-left-color: #ff3b30; color: #ff3b30; }
    .calllog-entry.offline_missed { border-left-color: #ffcc00; color: #ffcc00; }
    .calllog-entry.received { border-left-color: #30d158; color: #30d158; }
    .calllog-entry.dialed { border-left-color: #0a84ff; color: #0a84ff; }

    .sound-row { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: #ddd; text-align: left; }
    .sound-select-group { display: flex; gap: 6px; }

    .chat-drawer { position: relative; width: 100%; height: 100%; background: transparent; z-index: 12; display: flex; flex-direction: column; padding: 16px; }
    .messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px 4px; z-index: 1; }
    .msg { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 10px 14px; border-radius: 20px; border-bottom-left-radius: 4px; font-size: 0.95rem; max-width: 82%; width: fit-content; word-break: break-word; color: #fff; display: flex; flex-direction: column; z-index: 1; }
    .msg.me { background: linear-gradient(180deg, #0a84ff 0%, #0066cc 100%); border-radius: 20px; border-bottom-right-radius: 4px; align-self: flex-end; }
    .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 4px; align-self: flex-end; }
    .msg-time { font-size: 0.65rem; color: rgba(255, 255, 255, 0.6); text-transform: uppercase; }
    .tick-icon { font-size: 0.72rem; color: rgba(255, 255, 255, 0.5); font-weight: bold; }
    .tick-icon.blue { color: #34b7f1 !important; }
    .msg img, .msg video, .msg audio { max-width: 100%; border-radius: 12px; margin-top: 6px; display: block; }

    .ring-overlay { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); z-index: 40; width: 90%; max-width: 320px; background: rgba(255, 59, 48, 0.9); backdrop-filter: blur(20px); border-radius: 24px; padding: 16px; display: none; align-items: center; justify-content: space-between; box-shadow: 0 10px 30px rgba(255, 59, 48, 0.5); }
    #typing-indicator-box { font-size: 0.85rem; color: #30d158; font-style: italic; padding: 6px 12px; display: none; align-items: center; gap: 6px; background: rgba(48,209,88,0.1); border-radius: 12px; width: fit-content; margin-bottom: 6px; border: 1px solid rgba(48,209,88,0.2); }
  </style>
</head>
<body onunload="if(peer) peer.destroy(); sessionStorage.clear(); localStorage.clear();">

  <div id="app-container" onclick="closeSettingsMenu()">
    <video id="remote-video" autoplay playsinline></video>
    <div id="local-video-container"><video id="local-video" autoplay muted playsinline></video></div>

    <div id="teams-call-bar">
      <button class="teams-call-btn" id="teams-mute-btn" onclick="toggleTeamsMute()" title="Mute">🎤</button>
      <button class="teams-call-btn" id="teams-speaker-btn" onclick="toggleTeamsSpeaker()" title="Speaker">🔊</button>
      <button class="teams-call-btn" id="teams-share-btn" onclick="toggleTeamsScreenShare()" title="Share Screen">💻</button>
      <button class="teams-call-btn danger" onclick="endTeamsCall()" title="End Call">📞</button>
    </div>

    <div class="ring-overlay" id="ring-overlay">
      <div><div style="font-weight: bold; font-size: 1rem;">Incoming Call</div><div style="font-size: 0.8rem; opacity: 0.8;">Friend is calling</div></div>
      <div style="display: flex; gap: 8px;"><button class="btn" style="padding: 8px 12px; background:#30d158;" onclick="acceptCall()">Accept</button><button class="btn" style="padding: 8px 12px; background:#ff3b30;" onclick="rejectCall()">Reject</button></div>
    </div>

    <div class="modal" id="login-modal" onclick="event.stopPropagation()">
      <h3>Portal Login</h3>
      <input type="text" id="admin-user" placeholder="Username">
      <input type="password" id="admin-pass" placeholder="Password">
      <button class="btn" onclick="adminLogin()">Login & Connect</button>
    </div>

    <div class="modal" id="log-modal" onclick="event.stopPropagation()">
      <h3>📜 Friend Activity Log (Max 25)</h3>
      <div class="log-list" id="log-container"><div style="color: #aaa; text-align: center; font-style: italic; font-family: sans-serif;">No logs recorded yet</div></div>
      <div style="display: flex; gap: 8px;"><button class="btn" style="flex: 1; background: #333;" onclick="closeLogModal()">Close</button><button class="btn" style="flex: 1; background: #ff3b30;" onclick="clearActivityLogs()">Clear Logs</button></div>
    </div>

    <div class="modal" id="calllog-modal" onclick="event.stopPropagation()">
      <h3>📞 Call Logs (Missed, Received, Dialed)</h3>
      <div class="log-list" id="calllog-container"><div style="color: #aaa; text-align: center; font-style: italic; font-family: sans-serif;">No call logs recorded yet</div></div>
      <div style="display: flex; gap: 8px;"><button class="btn" style="flex: 1; background: #333;" onclick="closeCallLogModal()">Close</button><button class="btn" style="flex: 1; background: #ff3b30;" onclick="clearCallLogs()">Clear Logs</button></div>
    </div>

    <div class="modal" id="sound-modal" onclick="event.stopPropagation()">
      <h3>🎵 Notification Sounds</h3>
      <div class="sound-row"><label>🟢 Friend Available Sound:</label><div class="sound-select-group"><select id="select-online-sound"><option value="note">iPhone Note</option><option value="chord">iPhone Chord</option></select><button class="btn" style="padding: 8px 12px;" onclick="previewSound('online')">▶</button></div></div>
      <button class="btn" style="background: #333; margin-top: 6px;" onclick="closeSoundModal()">Close Settings</button>
    </div>

    <div class="chat-drawer" id="chat-drawer">
      <div class="admin-bar">
        <div><span class="status-indicator" id="status-dot"></span><span id="status-text">Waiting for SQA...</span></div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span>Timer:</span>
          <select id="self-destruct-timer" onchange="updateSelfDestructTimer()" style="width: auto;">
            <option value="0">Off</option><option value="5">5s</option><option value="10">10s</option><option value="30">30s</option>
          </select>
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">
          <button style="background: #ff3b30; border: none; color: #fff; padding: 6px 12px; border-radius: 10px; font-weight: 600; font-size: 0.75rem; cursor: pointer;" onclick="clearFriendChat()">Clear</button>
          <button class="settings-btn" onclick="toggleSettingsMenu(event)">⚙️</button>
        </div>

        <div class="settings-menu" id="settings-menu" onclick="event.stopPropagation()">
          <button class="menu-item" id="screenshare-btn" onclick="toggleScreenShare()">📺 Friend Screen</button>
          <button class="menu-item" id="admin-screenshare-btn" onclick="toggleAdminScreenShare()">💻 Share Screen</button>
          <button class="menu-item" id="one-way-voice-btn" onclick="toggleOneWayVoiceCall()">🎙️ One-Way Voice Call</button>
          <button class="menu-item" id="smiley-btn" onclick="toggleSmileyMode()">😊 Enable Smiley: OFF</button>
          <button class="menu-item" onclick="openCallLogModal()">📞 Call Logs</button>
          <button class="menu-item" onclick="openSoundModal()">🎵 Notification Sounds</button>
          <button class="menu-item" id="read-receipts-btn" onclick="toggleReadReceipts()">✓✓ Read Receipts: OFF</button>
          <button class="menu-item" id="touch-to-see-btn" onclick="toggleTouchToSeeMode()">👆 Touch to see: OFF</button>
          <button class="menu-item" id="secured-mode-btn" onclick="toggleMoreSecuredMode()">🔒 More Secured Mode: OFF</button>
          <button class="menu-item" onclick="openLogModal()">📜 Activity Logs</button>
          <button class="menu-item danger" onclick="stopVideo()">Stop All</button>
        </div>
      </div>

      <div id="messages" class="messages"></div>

      <div id="typing-indicator-box">Friend is typing: <span id="typing-preview-text" style="color: #fff; font-weight: 500;"></span></div>

      <div style="display: flex; gap: 8px; margin-top: 8px; align-items: center;" id="chat-input-row">
        <button onclick="dialVoiceCall()" title="Voice Call" style="background:none; border:none; font-size:1.3rem; cursor:pointer;">📞</button>
        <button onclick="dialVideoCall()" title="Video Call" style="background:none; border:none; font-size:1.3rem; cursor:pointer;">🎥</button>
        <label style="cursor:pointer; font-size: 1.2rem;">📎<input type="file" id="file-input" style="display:none;" onchange="sendFile(this)"></label>
        <input type="text" id="chat-input" placeholder="iMessage..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn" style="padding: 10px 18px; cursor:pointer;" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    // FIXED MASTER ID - Admin never changes its name
    const ADMIN_ID = "TECHINFRA_ADMIN_V1"; 
    
    let peer = null, localStream = null, screenStream = null, activeCall = null, activeConn = null;
    let friendDynamicId = null; // Dynamically saved when friend knocks
    
    let destructInterval = 0, activityLogs = [], callLogs = [];
    let isMoreSecuredMode = false, isTouchToSeeMode = false, isReadReceiptsForFriend = false, isSmileyEnabled = false;
    let isAdminMuted = false, isSpeakerOn = true, isOneWayVoiceActive = false, isFriendScreenActive = false, isAdminScreenActive = false;
    let ringtoneInterval = null, hasRungOffline = false;

    const crystalClearAudioConstraints = { audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 44100 } };

    const peerConfig = {
      host: 'teams-6yw1.onrender.com', port: 443, path: '/', secure: true,
      config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
    };

    let audioCtx = null;
    function getAudioContext() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } if (audioCtx.state === 'suspended') { audioCtx.resume(); } return audioCtx; }
    function playToneNote(freq, type, duration, delay = 0, vol = 0.3) {
      const ctx = getAudioContext(); setTimeout(() => { if (!ctx) return; const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime); gain.gain.setValueAtTime(vol, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + duration); }, delay);
    }
    function playFriendOnlineSound() { playToneNote(523.25, 'sine', 0.15, 0); playToneNote(659.25, 'sine', 0.25, 100); }
    function playMessageAlertSound() { playToneNote(1200, 'sine', 0.05, 0, 0.4); }
    function playCallRingtone() { playToneNote(587.33, 'triangle', 0.15, 0, 0.35); playToneNote(880, 'triangle', 0.15, 180, 0.35); playToneNote(783.99, 'triangle', 0.15, 360, 0.35); playToneNote(587.33, 'triangle', 0.3, 540, 0.3); }

    function startRingtoneLoop() { stopRingtoneLoop(); playCallRingtone(); ringtoneInterval = setInterval(playCallRingtone, 2200); }
    function stopRingtoneLoop() { if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; } }

    function previewSound(category) { if (category === 'online') playFriendOnlineSound(); if (category === 'msg') playMessageAlertSound(); if (category === 'call') playCallRingtone(); }
    function openSoundModal() { closeSettingsMenu(); document.getElementById('sound-modal').style.display = 'flex'; }
    function closeSoundModal() { document.getElementById('sound-modal').style.display = 'none'; }
    function getTimeStamp() { const now = new Date(); return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

    function toggleTeamsMute() { if (!localStream) return; isAdminMuted = !isAdminMuted; localStream.getAudioTracks().forEach(t => t.enabled = !isAdminMuted); document.getElementById('teams-mute-btn').style.background = isAdminMuted ? "#e81123" : "rgba(255,255,255,0.1)"; }
    function toggleTeamsSpeaker() { isSpeakerOn = !isSpeakerOn; document.getElementById('remote-video').muted = !isSpeakerOn; document.getElementById('teams-speaker-btn').style.background = isSpeakerOn ? "rgba(255,255,255,0.1)" : "#e81123"; }
    function toggleTeamsScreenShare() { toggleAdminScreenShare(); }
    function endTeamsCall() { stopVideo(); }

    function dialVoiceCall() {
      if (!activeConn || !activeConn.open || !friendDynamicId) return alert('Friend is not connected yet!');
      navigator.mediaDevices.getUserMedia({ video: false, ...crystalClearAudioConstraints }).then(stream => {
        localStream = stream; activeCall = peer.call(friendDynamicId, localStream); setupCallHandlers(activeCall);
        document.getElementById('teams-call-bar').style.display = 'flex'; activeConn.send({ type: 'incoming_call', callType: 'voice' });
      });
    }

    function dialVideoCall() {
      if (!activeConn || !activeConn.open || !friendDynamicId) return alert('Friend is not connected yet!');
      navigator.mediaDevices.getUserMedia({ video: true, ...crystalClearAudioConstraints }).then(stream => {
        localStream = stream; document.getElementById('local-video-container').style.display = 'block'; document.getElementById('local-video').srcObject = stream;
        activeCall = peer.call(friendDynamicId, localStream); setupCallHandlers(activeCall);
        document.getElementById('teams-call-bar').style.display = 'flex'; activeConn.send({ type: 'incoming_call', callType: 'video' });
      });
    }

    function setupCallHandlers(callObj) {
      callObj.on('stream', remoteStream => { const rv = document.getElementById('remote-video'); rv.srcObject = remoteStream; rv.muted = !isSpeakerOn; rv.style.display = 'block'; document.getElementById('teams-call-bar').style.display = 'flex'; });
      callObj.on('close', stopVideo);
    }

    function toggleScreenShare() {
      closeSettingsMenu(); if (!activeConn || !activeConn.open) return;
      const btn = document.getElementById('screenshare-btn');
      if (!isFriendScreenActive) { isFriendScreenActive = true; btn.innerText = "🛑 Stop Friend Screen"; btn.classList.add('active-mode'); activeConn.send({ type: 'cmd', command: 'start_screenshare' }); } 
      else { isFriendScreenActive = false; btn.innerText = "📺 Friend Screen"; btn.classList.remove('active-mode'); activeConn.send({ type: 'cmd', command: 'stop_screenshare' }); }
    }

    function toggleAdminScreenShare() {
      closeSettingsMenu(); if (!activeConn || !activeConn.open || !friendDynamicId) return;
      const btn = document.getElementById('admin-screenshare-btn');
      if (!isAdminScreenActive) {
        navigator.mediaDevices.getDisplayMedia({ video: true }).then(s => {
          screenStream = s; isAdminScreenActive = true; btn.innerText = "🛑 Stop Screen"; btn.classList.add('active-mode');
          peer.call(friendDynamicId, screenStream); screenStream.getVideoTracks()[0].onended = toggleAdminScreenShare;
        });
      } else {
        isAdminScreenActive = false; btn.innerText = "💻 Share Screen"; btn.classList.remove('active-mode');
        if (screenStream) screenStream.getTracks().forEach(t => t.stop()); activeConn.send({ type: 'cmd', command: 'stop_admin_screenshare' });
      }
    }

    function toggleOneWayVoiceCall() {
      closeSettingsMenu(); if (!activeConn || !activeConn.open || !friendDynamicId) return;
      const btn = document.getElementById('one-way-voice-btn'); isOneWayVoiceActive = !isOneWayVoiceActive;
      if (isOneWayVoiceActive) {
        btn.innerText = "🛑 Stop One-Way Voice"; btn.classList.add('active-mode');
        navigator.mediaDevices.getUserMedia({ video: false, ...crystalClearAudioConstraints }).then(stream => {
          localStream = stream; localStream.getAudioTracks().forEach(t => t.enabled = false);
          activeCall = peer.call(friendDynamicId, localStream); setupCallHandlers(activeCall); activeConn.send({ type: 'cmd', command: 'start_oneway_voice' });
        });
      } else {
        btn.innerText = "🎙️ One-Way Voice Call"; btn.classList.remove('active-mode'); if (activeCall) activeCall.close();
        document.getElementById('remote-video').style.display = 'none'; document.getElementById('teams-call-bar').style.display = 'none'; activeConn.send({ type: 'cmd', command: 'stop_oneway_voice' });
      }
    }

    function toggleSmileyMode() { closeSettingsMenu(); isSmileyEnabled = !isSmileyEnabled; document.getElementById('smiley-btn').innerText = isSmileyEnabled ? "😊 Enable Smiley: ON" : "😊 Enable Smiley: OFF"; document.getElementById('smiley-btn').classList.toggle('active-mode', isSmileyEnabled); if (activeConn && activeConn.open) activeConn.send({ type: 'cmd', command: 'set_smiley', value: isSmileyEnabled }); }

    function recordCallLog(type, details) { const timestamp = new Date().toLocaleString([], { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' }); callLogs.unshift({ type, details, timestamp }); if (callLogs.length > 25) callLogs.pop(); renderCallLogUI(); }
    function renderCallLogUI() { const c = document.getElementById('calllog-container'); if (!callLogs.length) { c.innerHTML = `<div style="color: #aaa; text-align: center; font-style: italic;">No call logs</div>`; return; } c.innerHTML = callLogs.map(log => `<div class="calllog-entry ${log.type}"><strong>[${log.timestamp}]</strong> ${log.details}</div>`).join(''); }
    function openCallLogModal() { closeSettingsMenu(); renderCallLogUI(); document.getElementById('calllog-modal').style.display = 'flex'; }
    function closeCallLogModal() { document.getElementById('calllog-modal').style.display = 'none'; }
    function clearCallLogs() { callLogs = []; renderCallLogUI(); }

    function toggleReadReceipts() { closeSettingsMenu(); isReadReceiptsForFriend = !isReadReceiptsForFriend; document.getElementById('read-receipts-btn').innerText = isReadReceiptsForFriend ? "✓✓ Read Receipts: ON" : "✓✓ Read Receipts: OFF"; document.getElementById('read-receipts-btn').classList.toggle('active-mode', isReadReceiptsForFriend); if (activeConn && activeConn.open) activeConn.send({ type: 'cmd', command: 'set_read_receipts', value: isReadReceiptsForFriend }); }
    function toggleTouchToSeeMode() { closeSettingsMenu(); isTouchToSeeMode = !isTouchToSeeMode; document.getElementById('touch-to-see-btn').innerText = isTouchToSeeMode ? "👆 Touch to see: ON" : "👆 Touch to see: OFF"; document.getElementById('touch-to-see-btn').classList.toggle('active-mode', isTouchToSeeMode); if (activeConn && activeConn.open) activeConn.send({ type: 'cmd', command: 'set_touch_to_see', value: isTouchToSeeMode }); }
    function toggleMoreSecuredMode() { closeSettingsMenu(); isMoreSecuredMode = !isMoreSecuredMode; document.getElementById('secured-mode-btn').innerText = isMoreSecuredMode ? "🔒 More Secured Mode: ON" : "🔒 More Secured Mode: OFF"; document.getElementById('secured-mode-btn').classList.toggle('active-mode', isMoreSecuredMode); if (activeConn && activeConn.open) activeConn.send({ type: 'cmd', command: 'set_more_secured', value: isMoreSecuredMode }); }

    function recordActivityLog(type, details) { const timestamp = new Date().toLocaleString([], { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' }); activityLogs.unshift({ type, details, timestamp }); if (activityLogs.length > 25) activityLogs.pop(); renderLogUI(); }
    function renderLogUI() { const c = document.getElementById('log-container'); if (!activityLogs.length) { c.innerHTML = `<div style="color: #aaa; text-align: center; font-style: italic;">No logs</div>`; return; } c.innerHTML = activityLogs.map(log => `<div class="log-entry ${log.type}"><strong>[${log.timestamp}]</strong> ${log.details}</div>`).join(''); }
    function openLogModal() { closeSettingsMenu(); renderLogUI(); document.getElementById('log-modal').style.display = 'flex'; }
    function closeLogModal() { document.getElementById('log-modal').style.display = 'none'; }
    function clearActivityLogs() { activityLogs = []; renderLogUI(); }

    function adminLogin() {
      const u = document.getElementById('admin-user').value.trim(); const p = document.getElementById('admin-pass').value.trim();
      if (u === 'admin' && p === 'admin') { document.getElementById('login-modal').style.display = 'none'; initAdminSession(); loadPersistentChatHistory(); } 
      else { alert('Invalid Login Credentials!'); }
    }

    function toggleSettingsMenu(e) { e.stopPropagation(); const m = document.getElementById('settings-menu'); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; }
    function closeSettingsMenu() { document.getElementById('settings-menu').style.display = 'none'; }

    // === MASTER SERVER CONNECTION ENGINE ===
    // Admin ONLY listens. It never actively seeks the friend.
    function initAdminSession() {
      if (peer) peer.destroy();
      peer = new Peer(ADMIN_ID, peerConfig);

      peer.on('open', () => {
        onConnected();
        updateConnectionStatus(false); // Waiting...
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          // If ghost ID exists, retry forcefully until claimed
          setTimeout(initAdminSession, 2000); 
        }
      });

      peer.on('connection', incoming => {
        setupConnection(incoming);
      });

      peer.on('call', call => {
        call.answer(localStream || undefined);
        activeCall = call;
        setupCallHandlers(call);
        recordCallLog('received', 'Received Call from Friend');
      });

      navigator.mediaDevices.getUserMedia({ video: true, ...crystalClearAudioConstraints }).then(stream => {
        localStream = stream; stream.getVideoTracks().forEach(t => t.enabled = false); stream.getAudioTracks().forEach(t => t.enabled = true); document.getElementById('local-video').srcObject = stream;
      }).catch(err => console.warn(err));
    }

    function setupConnection(conn) {
      // Force kill old ghosts
      if (activeConn && activeConn.open) { activeConn.close(); }
      
      activeConn = conn;
      friendDynamicId = conn.peer; 
      
      const onReady = () => {
        updateConnectionStatus(true);
        recordActivityLog('login', 'SQA Connected (Logged In)');
        playFriendOnlineSound();

        if (hasRungOffline) { recordCallLog('offline_missed', 'Offline Missed Call'); hasRungOffline = false; }
        activeConn.send({ type: 'req_offline' });
        if (isMoreSecuredMode) activeConn.send({ type: 'cmd', command: 'set_more_secured', value: true });
        if (isTouchToSeeMode) activeConn.send({ type: 'cmd', command: 'set_touch_to_see', value: true });
        if (isReadReceiptsForFriend) activeConn.send({ type: 'cmd', command: 'set_read_receipts', value: true });
        if (isSmileyEnabled) activeConn.send({ type: 'cmd', command: 'set_smiley', value: true });
      };

      if (conn.open) onReady();
      else conn.on('open', onReady);

      conn.on('data', data => {
        if (typeof data === 'object') {
          if (data.type === 'typing_preview') {
            const tb = document.getElementById('typing-indicator-box'); const pt = document.getElementById('typing-preview-text');
            if (data.text && data.text.length > 0) { tb.style.display = 'flex'; pt.innerText = data.text; } else { tb.style.display = 'none'; pt.innerText = ''; }
          }
          else if (data.type === 'msg_ack') { updateMessageTicks(data.msgId, data.status); }
          else if (data.type === 'file') { playMessageAlertSound(); renderFileMessage(data, false); saveChatMessageToPersistentStorage(data, false); }
          else if (data.type === 'msg') {
            document.getElementById('typing-indicator-box').style.display = 'none'; playMessageAlertSound();
            addMessage(data.text, false, data.time || getTimeStamp(), data.id); saveChatMessageToPersistentStorage(data, false);
            activeConn.send({ type: 'msg_ack', msgId: data.id, status: 'delivered' });
            setTimeout(() => { if (activeConn && activeConn.open) activeConn.send({ type: 'msg_ack', msgId: data.id, status: 'read' }); }, 400);
            if (data.text.toLowerCase().trim() === 'call bae') { document.getElementById('ring-overlay').style.display = 'flex'; startRingtoneLoop(); recordCallLog('received', 'Incoming Call'); }
          }
        } else if (typeof data === 'string') { playMessageAlertSound(); addMessage(data, false, getTimeStamp()); saveChatMessageToPersistentStorage({ text: data, time: getTimeStamp() }, false); }
      });

      const onDisconnect = () => {
        activeConn = null; friendDynamicId = null; updateConnectionStatus(false); stopRingtoneLoop();
      };
      
      conn.on('close', onDisconnect);
      conn.on('error', onDisconnect);
    }

    function updateConnectionStatus(isOnline) {
      const dot = document.getElementById('status-dot'); const text = document.getElementById('status-text');
      if (isOnline) { dot.classList.add('online'); text.innerText = "SQA Connected"; } 
      else { dot.classList.remove('online'); text.innerText = "Waiting for SQA..."; }
    }

    function onConnected() { document.getElementById('chat-drawer').style.display = 'flex'; lucide.createIcons(); }
    function acceptCall() { stopRingtoneLoop(); document.getElementById('ring-overlay').style.display = 'none'; alert('Audio Call Connected'); }
    function rejectCall() { stopRingtoneLoop(); document.getElementById('ring-overlay').style.display = 'none'; recordCallLog('missed', 'Rejected Call'); if (activeConn) activeConn.send({ type: 'call_failed' }); }

    function stopVideo() {
      closeSettingsMenu(); if (activeCall) activeCall.close(); if (screenStream) screenStream.getTracks().forEach(t => t.stop());
      if (activeConn && activeConn.open) { activeConn.send({ type: 'cmd', command: 'stop_screenshare' }); activeConn.send({ type: 'cmd', command: 'stop_admin_screenshare' }); activeConn.send({ type: 'cmd', command: 'stop_oneway_voice' }); activeConn.send({ type: 'end_call' }); }
      if (localStream) localStream.getTracks().forEach(t => t.stop()); document.getElementById('local-video-container').style.display = 'none'; document.getElementById('remote-video').style.display = 'none'; document.getElementById('teams-call-bar').style.display = 'none';
      isFriendScreenActive = false; isAdminScreenActive = false; isOneWayVoiceActive = false; document.getElementById('screenshare-btn').innerText = "📺 Friend Screen"; document.getElementById('screenshare-btn').classList.remove('active-mode'); document.getElementById('admin-screenshare-btn').innerText = "💻 Share Screen"; document.getElementById('admin-screenshare-btn').classList.remove('active-mode'); document.getElementById('one-way-voice-btn').innerText = "🎙️ One-Way Voice Call"; document.getElementById('one-way-voice-btn').classList.remove('active-mode');
    }

    function saveChatMessageToPersistentStorage(msgObj, isMe) { let history = JSON.parse(localStorage.getItem('admin_permanent_chat_history') || '[]'); if (msgObj.id && history.some(item => item.id === msgObj.id)) return; history.push({ ...msgObj, isMe }); localStorage.setItem('admin_permanent_chat_history', JSON.stringify(history)); }
    function loadPersistentChatHistory() { let history = JSON.parse(localStorage.getItem('admin_permanent_chat_history') || '[]'); document.getElementById('messages').innerHTML = ''; history.forEach(item => { if (item.type === 'file') renderFileMessageFromStorage(item, item.isMe); else addMessage(item.text || item, item.isMe, item.time || getTimeStamp(), item.id); }); }
    function renderFileMessageFromStorage(fileObj, isMe) { const div = document.createElement('div'); div.className = 'msg ' + (isMe ? 'me' : ''); let cHTML = `<div style="font-size:0.8rem; font-weight:600; margin-bottom:4px;">📎 ${fileObj.name}</div>`; if (fileObj.mime && fileObj.mime.startsWith('image/')) cHTML += `<img src="${fileObj.data}" alt="attachment" />`; else if (fileObj.mime && fileObj.mime.startsWith('video/')) cHTML += `<video src="${fileObj.data}" controls></video>`; cHTML += `<a href="${fileObj.data}" download="${fileObj.name}" style="color:#30d158; font-size:0.75rem; display:block; margin-top:6px;">Download File</a><div class="msg-meta"><span class="msg-time">${fileObj.time || getTimeStamp()}</span></div>`; div.innerHTML = cHTML; const box = document.getElementById('messages'); box.appendChild(div); box.scrollTop = box.scrollHeight; }
    function sendFile(input) { const file = input.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { const fileData = { type: 'file', name: file.name, mime: file.type, data: e.target.result, time: getTimeStamp() }; if (activeConn && activeConn.open) activeConn.send(fileData); else { let ob = JSON.parse(localStorage.getItem('admin_outbox') || '[]'); ob.push(fileData); localStorage.setItem('admin_outbox', JSON.stringify(ob)); } renderFileMessage(fileData, true); saveChatMessageToPersistentStorage(fileData, true); input.value = ''; }; reader.readAsDataURL(file); }
    function renderFileMessage(fileObj, isMe) { const div = document.createElement('div'); div.className = 'msg ' + (isMe ? 'me' : ''); let cHTML = `<div style="font-size:0.8rem; font-weight:600; margin-bottom:4px;">📎 ${fileObj.name}</div>`; if (fileObj.mime.startsWith('image/')) cHTML += `<img src="${fileObj.data}" alt="attachment" />`; else if (fileObj.mime.startsWith('video/')) cHTML += `<video src="${fileObj.data}" controls></video>`; cHTML += `<a href="${fileObj.data}" download="${fileObj.name}" style="color:#30d158; font-size:0.75rem; display:block; margin-top:6px;">Download File</a><div class="msg-meta"><span class="msg-time">${fileObj.time || getTimeStamp()}</span></div>`; div.innerHTML = cHTML; const box = document.getElementById('messages'); box.appendChild(div); box.scrollTop = box.scrollHeight; }
    function updateSelfDestructTimer() { destructInterval = parseInt(document.getElementById('self-destruct-timer').value, 10); if (activeConn && activeConn.open) activeConn.send({ type: 'cmd', command: 'set_destruct', value: destructInterval }); }
    function clearFriendChat() { if (confirm("Are you sure you want to clear permanent chat history?")) { localStorage.removeItem('admin_permanent_chat_history'); document.getElementById('messages').innerHTML = ''; if (activeConn && activeConn.open) activeConn.send({ type: 'clear' }); } }
    function sendMessage() { const input = document.getElementById('chat-input'); const msg = input.value.trim(); if (!msg) return; const currentTime = getTimeStamp(); const msgId = 'msg_' + Date.now(); const msgObj = { type: 'msg', text: msg, destruct: destructInterval, time: currentTime, id: msgId }; if (activeConn && activeConn.open) activeConn.send(msgObj); else { let ob = JSON.parse(localStorage.getItem('admin_outbox') || '[]'); ob.push(msgObj); localStorage.setItem('admin_outbox', JSON.stringify(ob)); if (msg.toLowerCase() === 'call bae') hasRungOffline = true; } addMessage(msg, true, currentTime, msgId); saveChatMessageToPersistentStorage(msgObj, true); input.value = ''; }
    function addMessage(msg, isMe, timeStr, msgId) { const div = document.createElement('div'); div.className = 'msg ' + (isMe ? 'me' : ''); if (msgId) div.id = msgId; let mHTML = `<div class="msg-meta"><span class="msg-time">${timeStr || getTimeStamp()}</span>`; if (isMe) mHTML += `<span class="tick-icon" id="tick_${msgId}">✓</span>`; mHTML += `</div>`; div.innerHTML = `<span>${msg}</span>` + mHTML; const box = document.getElementById('messages'); box.appendChild(div); box.scrollTop = box.scrollHeight; }
    function updateMessageTicks(msgId, status) { const ts = document.getElementById(`tick_${msgId}`); if (!ts) return; if (status === 'delivered') ts.innerText = '✓✓'; else if (status === 'read') { ts.innerText = '✓✓'; ts.classList.add('blue'); } }

    const dragCard = document.getElementById('local-video-container'); let active = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0; dragCard.addEventListener("touchstart", e => { initialX = e.touches[0].clientX - xOffset; initialY = e.touches[0].clientY - yOffset; active = true; }, false); dragCard.addEventListener("touchend", () => { initialX = currentX; initialY = currentY; active = false; }, false); dragCard.addEventListener("touchmove", e => { if (active) { e.preventDefault(); currentX = e.touches[0].clientX - initialX; currentY = e.touches[0].clientY - initialY; xOffset = currentX; yOffset = currentY; dragCard.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`; } }, false); lucide.createIcons();
  </script>
</body>
