<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Admin Control Portal</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #000; color: #f5f5f7; }

    #app-container { position: relative; width: 100%; height: 100%; background: radial-gradient(circle at 50% 20%, #161622 0%, #08080c 100%); display: flex; flex-direction: column; }

    /* CHAT DRAWER & HEADER */
    .chat-drawer { position: relative; width: 100%; height: 100%; background: transparent; z-index: 12; display: none; flex-direction: column; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    
    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: rgba(20, 20, 30, 0.85);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 1000; padding-top: max(12px, env(safe-area-inset-top));
    }
    .header-user { display: flex; align-items: center; gap: 12px; }
    .header-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #0a84ff, #005ec4); display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 4px 10px rgba(10,132,255,0.3); }
    .header-info { display: flex; flex-direction: column; }
    .header-name { font-weight: 600; font-size: 1.05rem; color: #fff; letter-spacing: 0.3px; }
    .header-status { font-size: 0.75rem; color: #aaa; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; box-shadow: 0 0 8px #ff3b30; transition: all 0.3s; }
    .status-dot.online { background: #30d158; box-shadow: 0 0 8px #30d158; }
    
    .header-actions { display: flex; align-items: center; gap: 10px; position: relative; }
    
    .timer-pill {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px; padding: 6px 12px; color: #fff; font-size: 0.85rem; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; gap: 6px; touch-action: manipulation; transition: background 0.2s;
    }
    .timer-pill:active { background: rgba(255,255,255,0.2); }
    
    .timer-dropdown {
      position: absolute; top: 48px; right: 45px; z-index: 99999;
      background: rgba(30, 30, 42, 0.95); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 18px;
      padding: 6px; display: none; flex-direction: column; gap: 4px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); width: 130px;
    }
    .timer-option { padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; color: #fff !important; cursor: pointer; text-align: left; transition: background 0.15s; background: transparent; }
    .timer-option:hover { background: rgba(255, 255, 255, 0.15); color: #fff !important; }
    .timer-option.selected { color: #30d158 !important; font-weight: 600; background: rgba(48, 209, 88, 0.15); }

    .settings-btn { background: rgba(255, 255, 255, 0.1); color: #fff; min-height: 38px; min-width: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; touch-action: manipulation; transition: 0.2s; }
    .settings-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.25); }

    /* --- AUTHENTIC MS TEAMS CALL UI (MATCHES IMAGE 4) --- */
    #call-ui {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
      background: #181824; z-index: 9000; flex-direction: column; justify-content: space-between;
      padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)) 16px;
      overflow: hidden;
    }

    .teams-top-header { display: flex; align-items: center; justify-content: space-between; color: #fff; z-index: 9005; }
    .teams-header-left { display: flex; align-items: center; gap: 12px; }
    .teams-back-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; }
    .teams-call-title-box { display: flex; flex-direction: column; }
    .teams-user-title { font-weight: 600; font-size: 1rem; color: #fff; }
    .teams-call-meta { font-size: 0.75rem; color: #a0a0b0; display: flex; align-items: center; gap: 4px; }
    .teams-header-actions { display: flex; align-items: center; gap: 16px; }

    .teams-center-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 9005; }
    .teams-avatar-circle {
      width: 100px; height: 100px; border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; font-weight: 600; color: #fff;
      box-shadow: 0 0 0 8px rgba(168, 85, 247, 0.2); margin-bottom: 16px;
    }
    .teams-center-name { font-size: 1.25rem; font-weight: 600; color: #fff; margin-top: 4px; }
    .teams-connecting-sub { font-size: 0.9rem; color: #94a3b8; margin-top: 6px; }

    #remote-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: none; z-index: 9001; }
    #local-video-container { position: absolute; top: max(60px, env(safe-area-inset-top)); right: 16px; width: 100px; height: 145px; border-radius: 16px; overflow: hidden; z-index: 9010; border: 2px solid rgba(255,255,255,0.2); background: #000; display: none; }
    #local-video { width: 100%; height: 100%; object-fit: cover; }

    /* MS TEAMS BOTTOM CONTROL SHEET */
    .teams-control-card {
      background: rgba(30, 30, 44, 0.95); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 28px;
      padding: 20px 16px 16px 16px; display: flex; flex-direction: column; gap: 16px; z-index: 9005;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8); width: 100%; max-width: 420px; margin: 0 auto;
    }
    .teams-grid-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 12px; text-align: center; }
    .teams-grid-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #fff; font-size: 0.72rem; cursor: pointer; opacity: 0.95; }
    .teams-grid-btn {
      width: 52px; height: 52px; border-radius: 50%; background: rgba(255, 255, 255, 0.1);
      border: none; color: #fff; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; touch-action: manipulation;
    }
    .teams-grid-btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.25); }
    .teams-grid-btn.active-off { background: #ff3b30; color: #fff; }

    .teams-end-call-btn {
      width: 100%; height: 50px; border-radius: 25px; background: #ff3b30; border: none;
      color: #fff; font-weight: 600; font-size: 1rem; display: flex; align-items: center;
      justify-content: center; gap: 10px; cursor: pointer; box-shadow: 0 8px 20px rgba(255, 59, 48, 0.4);
      touch-action: manipulation; transition: transform 0.2s;
    }
    .teams-end-call-btn:active { transform: scale(0.96); }

    /* MODALS & SETTINGS */
    .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3000; width: 88%; max-width: 380px; background: rgba(30, 30, 45, 0.95); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px); padding: 24px; border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.18); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7); display: flex; flex-direction: column; gap: 14px; }
    .modal h3 { font-weight: 600; font-size: 1.2rem; text-align: center; color: #fff; margin-bottom: 8px; }
    input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(0, 0, 0, 0.4); color: #fff; font-size: 16px; outline: none; }
    .btn { padding: 14px; min-height: 50px; border-radius: 16px; border: none; background: linear-gradient(180deg, #0a84ff 0%, #0066cc 100%); color: #fff; font-weight: 600; font-size: 0.95rem; cursor: pointer; touch-action: manipulation; display: flex; align-items: center; justify-content: center; gap: 8px; }

    .settings-menu { position: absolute; top: max(70px, env(safe-area-inset-top)); right: 16px; z-index: 99999; background: rgba(30, 30, 40, 0.65); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 24px; padding: 16px; display: none; flex-direction: column; gap: 10px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); width: 280px; max-height: 75vh; overflow-y: auto; }
    .menu-item { padding: 12px 16px; border-radius: 16px; border: 1px solid transparent; background: rgba(255, 255, 255, 0.05); color: #fff; font-size: 0.9rem; font-weight: 500; cursor: pointer; text-align: left; touch-action: manipulation; display: flex; align-items: center; gap: 14px; transition: all 0.2s ease; }
    .menu-item:hover { background: rgba(255, 255, 255, 0.1); }
    .menu-item.active-mode { background: linear-gradient(135deg, rgba(48,209,88,0.2) 0%, rgba(36,138,61,0.2) 100%); border: 1px solid rgba(48,209,88,0.3); color: #30d158; }
    .menu-item.danger { background: linear-gradient(135deg, rgba(255,59,48,0.2) 0%, rgba(215,0,21,0.2) 100%); border: 1px solid rgba(255,59,48,0.3); color: #ff453a; }
    .menu-item i { width: 20px; height: 20px; opacity: 0.9; }

    #log-modal, #sound-modal, #calllog-modal { display: none; z-index: 6000; max-height: 85vh; overflow-y: auto; }
    .log-list { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; max-height: 300px; overflow-y: auto; font-size: 0.85rem; font-family: monospace; padding-right: 4px; }
    .log-entry, .calllog-entry { padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,0.08); border-left: 4px solid #0a84ff; word-break: break-word; }

    .messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 16px; z-index: 1; }
    
    .msg { 
      position: relative; background: rgba(45, 45, 55, 0.65); backdrop-filter: blur(25px) saturate(200%); -webkit-backdrop-filter: blur(25px) saturate(200%); 
      padding: 12px 18px; border-radius: 24px; border-bottom-left-radius: 6px; font-size: 0.98rem; line-height: 1.45; max-width: 80%; width: fit-content; word-break: break-word; color: #fff; 
      display: flex; flex-direction: column; white-space: pre-wrap; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 4px 15px rgba(0,0,0,0.2); cursor: pointer; 
    }
    .msg.me { 
      background: linear-gradient(145deg, #007aff 0%, #0056d6 100%); border-radius: 24px; border-bottom-right-radius: 6px; align-self: flex-end; 
      border: 1px solid rgba(0, 0, 0, 0.1); box-shadow: 0 4px 15px rgba(0, 122, 255, 0.35); 
    }
    
    .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 6px; align-self: flex-end; }
    .msg-time { font-size: 0.7rem; color: rgba(255, 255, 255, 0.7); }
    .tick-icon { font-size: 0.72rem; color: rgba(255, 255, 255, 0.6); font-weight: bold; }

    .reaction-bar { display: none; position: fixed; background: rgba(30, 30, 45, 0.95); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.2); padding: 8px 14px; border-radius: 24px; gap: 14px; z-index: 10000; box-shadow: 0 10px 40px rgba(0,0,0,0.6); transform: translate(-50%, -100%); align-items: center; justify-content: center; }
    .reaction-bar span { font-size: 1.4rem; cursor: pointer; transition: transform 0.2s; padding: 2px; }
    .reactions-container { display: flex; gap: 4px; position: absolute; bottom: -14px; right: 12px; background: rgba(30,30,40,0.95); padding: 4px 8px; border-radius: 14px; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.2); z-index: 2; }

    .ring-overlay { position: absolute; top: max(30px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 320px; background: rgba(255, 59, 48, 0.95); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-radius: 24px; padding: 20px; display: none; align-items: center; justify-content: space-between; box-shadow: 0 10px 30px rgba(255, 59, 48, 0.5); }
    #typing-indicator-box { font-size: 0.85rem; color: #30d158; font-style: italic; padding: 8px 16px; display: none; align-items: center; gap: 8px; background: rgba(48,209,88,0.15); border-radius: 16px; width: fit-content; margin-bottom: 8px; margin-left: 16px; border: 1px solid rgba(48,209,88,0.3); backdrop-filter: blur(10px); }

    /* MULTILINE TEXTAREA INPUT BAR */
    #chat-input-row { 
      display: flex; flex-direction: row; gap: 10px; align-items: flex-end; justify-content: space-between;
      background: rgba(30, 30, 45, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); 
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 24px; padding: 10px 8px 10px 16px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); margin: 0 16px; 
    }
    .action-icon-group { display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding-bottom: 4px; }
    .action-icon-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); color: #fff; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; touch-action: manipulation; transition: all 0.2s ease; }
    .action-icon-btn.call-btn { background: rgba(48, 209, 88, 0.2); color: #30d158; border-color: rgba(48, 209, 88, 0.4); }

    .input-wrapper { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; }
    #chat-input { width: 100%; border: none; outline: none; background: transparent; color: #fff; font-size: 16px; user-select: text; -webkit-user-select: text; padding: 6px 0; resize: none; max-height: 120px; line-height: 1.4; }
    #chat-input::placeholder { color: rgba(255, 255, 255, 0.5); }
    
    .send-btn { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: none; background: linear-gradient(135deg, #0a84ff 0%, #005ec4 100%); color: #fff; cursor: pointer; box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4); display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; touch-action: manipulation; margin-bottom: 2px; }
    .send-btn:active { transform: scale(0.9); }
  </style>
</head>
<body onunload="handlePageClose()">

  <div id="reaction-bar" class="reaction-bar">
    <span onclick="sendReaction('👍', event)">👍</span>
    <span onclick="sendReaction('❤️', event)">❤️</span>
    <span onclick="sendReaction('😂', event)">😂</span>
    <span onclick="sendReaction('👏', event)">👏</span>
    <span onclick="sendReaction('😢', event)">😢</span>
  </div>

  <div id="app-container" onclick="closeSettingsMenu(); closeReactionBar(); closeTimerDropdown();">
    
    <!-- AUTHENTIC MS TEAMS CALL OVERLAY UI -->
    <div id="call-ui">
      <video id="remote-video" autoplay playsinline></video>
      <audio id="remote-audio" autoplay playsinline></audio>

      <!-- TOP HEADER -->
      <div class="teams-top-header">
        <div class="teams-header-left">
          <button class="teams-back-btn" onclick="endTeamsCall()"><i data-lucide="chevron-left" style="width:24px; height:24px;"></i></button>
          <div class="teams-call-title-box">
            <span class="teams-user-title">SQA Friend</span>
            <div class="teams-call-meta">
              <span id="call-duration">Connecting...</span>
              <i data-lucide="shield-check" style="width:12px; height:12px; color:#30d158; margin-left:2px;"></i>
            </div>
          </div>
        </div>
        <div class="teams-header-actions">
          <i data-lucide="message-square" style="width:20px; height:20px; cursor:pointer;" onclick="endTeamsCall()"></i>
          <i data-lucide="users" style="width:20px; height:20px; cursor:pointer;"></i>
        </div>
      </div>

      <!-- CENTER AVATAR & NAME -->
      <div class="teams-center-stage" id="audio-only-ui">
        <div class="teams-avatar-circle">SF</div>
        <div class="teams-center-name">SQA Friend</div>
        <div class="teams-connecting-sub" id="call-ui-subtext">Calling...</div>
      </div>

      <!-- LOCAL VIDEO SELF-PREVIEW -->
      <div id="local-video-container">
        <video id="local-video" autoplay muted playsinline></video>
        <button id="hide-video-btn" onclick="toggleLocalVideoVisibility()"><i data-lucide="x" style="width:14px; height:14px;"></i></button>
      </div>

      <!-- BOTTOM CONTROL CARD GRID -->
      <div class="teams-control-card">
        <div class="teams-grid-controls">
          <div class="teams-grid-item" onclick="toggleTeamsMic()">
            <button class="teams-grid-btn" id="call-mic-btn"><i data-lucide="mic"></i></button>
            <span id="mic-lbl">Mic On</span>
          </div>
          <div class="teams-grid-item" onclick="toggleTeamsCam()">
            <button class="teams-grid-btn" id="call-cam-btn"><i data-lucide="camera-off"></i></button>
            <span id="cam-lbl">Video Off</span>
          </div>
          <div class="teams-grid-item" onclick="toggleSpeakerOutput()">
            <button class="teams-grid-btn" id="call-speaker-btn"><i data-lucide="volume-2"></i></button>
            <span>Speaker</span>
          </div>
          <div class="teams-grid-item">
            <button class="teams-grid-btn"><i data-lucide="pause"></i></button>
            <span>Hold</span>
          </div>
          <div class="teams-grid-item" onclick="toggleScreenShare()">
            <button class="teams-grid-btn"><i data-lucide="share"></i></button>
            <span>Share</span>
          </div>
          <div class="teams-grid-item" onclick="toggleSettingsMenu(event)">
            <button class="teams-grid-btn"><i data-lucide="more-horizontal"></i></button>
            <span>More</span>
          </div>
        </div>

        <button class="teams-end-call-btn" onclick="endTeamsCall()">
          <i data-lucide="phone-off" style="width:20px; height:20px;"></i>
          End call
        </button>
      </div>
    </div>

    <!-- INCOMING RING OVERLAY -->
    <div class="ring-overlay" id="ring-overlay">
      <div>
        <div style="font-weight: 600; font-size: 1.1rem; margin-bottom:4px;" id="ring-title">Incoming Call</div>
        <div style="font-size: 0.85rem; opacity: 0.8;">Friend is calling</div>
      </div>
      <div style="display: flex; gap: 12px;">
        <button class="btn" style="padding: 10px 20px; background:#30d158; min-height:44px;" onclick="acceptCall()"><i data-lucide="phone" style="width:18px;"></i></button>
        <button class="btn" style="padding: 10px 20px; background:#ff3b30; min-height:44px;" onclick="rejectCall()"><i data-lucide="phone-off" style="width:18px;"></i></button>
      </div>
    </div>

    <div class="modal" id="login-modal" onclick="event.stopPropagation()">
      <h3>Portal Login</h3>
      <input type="text" id="admin-user" placeholder="Username" autocomplete="off">
      <input type="password" id="admin-pass" placeholder="Password">
      <button class="btn" onclick="adminLogin()"><i data-lucide="log-in"></i> Login & Connect</button>
    </div>

    <div class="modal" id="log-modal" onclick="event.stopPropagation()">
      <h3>Activity Logs</h3>
      <div class="log-list" id="log-container"></div>
      <button class="btn" style="background:#333; margin-top:10px;" onclick="closeLogModal()">Close</button>
    </div>

    <div class="chat-drawer" id="chat-drawer">
      <div class="chat-header">
        <div class="header-user">
          <div class="header-avatar"><i data-lucide="user" style="width: 24px; height: 24px;"></i></div>
          <div class="header-info">
            <div class="header-name">SQA Friend</div>
            <div class="header-status"><span class="status-dot" id="status-dot"></span><span id="status-text" style="font-weight:500;">Waiting...</span></div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; position:relative;">
          <div class="timer-pill" onclick="toggleTimerDropdown(event)">
            <i data-lucide="clock" style="width:14px; height:14px;"></i> <span id="timer-label">Off</span> <i data-lucide="chevron-down" style="width:12px; height:12px;"></i>
          </div>
          <div class="timer-dropdown" id="timer-dropdown" onclick="event.stopPropagation()">
            <div class="timer-option selected" onclick="selectTimer(0, 'Off')">Off</div>
            <div class="timer-option" onclick="selectTimer(15, '15s')">15s</div>
            <div class="timer-option" onclick="selectTimer(30, '30s')">30s</div>
            <div class="timer-option" onclick="selectTimer(60, '60s')">60s</div>
            <div class="timer-option" onclick="selectTimer(120, '120s')">120s</div>
          </div>
          <button class="settings-btn" onclick="toggleSettingsMenu(event)"><i data-lucide="settings" style="width:20px;height:20px;"></i></button>
        </div>

        <div class="settings-menu" id="settings-menu" onclick="event.stopPropagation()">
          <button class="menu-item" id="item-header-vis" onclick="toggleHeaderVisibility()"><i data-lucide="eye-off"></i> Show Header: OFF</button>
          <button class="menu-item" id="item-record" onclick="toggleScreenRecording()"><i data-lucide="video"></i> Start Recording</button>
          <button class="menu-item" id="item-export" onclick="exportChatHistory()"><i data-lucide="download"></i> Export Chat (TXT)</button>
          <button class="menu-item" id="item-backup" onclick="toggleAutoBackup()"><i data-lucide="refresh-cw"></i> Auto-Backup: OFF</button>
          <button class="menu-item" id="item-call-access" onclick="toggleFriendCallAccess()"><i data-lucide="phone-call"></i> Allow Friend Calls: OFF</button>
          <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:4px 0;">
          <button class="menu-item danger" onclick="clearFriendChat()"><i data-lucide="trash-2"></i> Clear Friend UI</button>
        </div>
      </div>

      <div id="messages" class="messages"></div>

      <div id="typing-indicator-box"><i data-lucide="edit-2" style="width:14px;"></i> Friend is typing: <span id="typing-preview-text" style="color: #fff; font-weight: 600;"></span></div>

      <div id="chat-input-row">
        <div class="action-icon-group">
          <label class="action-icon-btn" title="Attach"><i data-lucide="paperclip" style="width:20px;"></i><input type="file" style="display:none;" onchange="sendFile(this)"></label>
          <button class="action-icon-btn call-btn" onclick="dialVoiceCall()" title="Voice Call"><i data-lucide="phone" style="width:18px;"></i></button>
          <button class="action-icon-btn call-btn" onclick="dialVideoCall()" title="Video Call"><i data-lucide="video" style="width:20px;"></i></button>
        </div>
        
        <div class="input-wrapper">
          <textarea id="chat-input" rows="1" placeholder="Message..." onkeydown="handleKeyInput(event)" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight, 120)+'px'"></textarea>
        </div>
        
        <button class="send-btn" onclick="sendMessage()"><i data-lucide="send" style="width:18px;"></i></button>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_ID = "TECHINFRA_ADMIN_V1"; 
    
    let peer = null, localStream = null, screenStream = null, activeCall = null, activeConn = null, incomingCallObj = null;
    let friendDynamicId = null; 
    let currentCallType = 'voice', callDurationTimer = null, callSeconds = 0;
    
    let destructInterval = 0, activityLogs = [];
    let isFriendCallAllowed = false, isHeaderVisible = false;
    let isCallMuted = false, isCamOff = false, isSpeakerOn = true;
    let ringtoneInterval = null;

    let heartbeatInterval = null, heartbeatCheckInterval = null, lastPingReceived = 0;
    let activeReactionMsgId = null;
    let isAnsweringCall = false;

    const voiceOnlyConstraints = { video: false, audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } };
    const videoCallConstraints = { video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } };

    // HIGH-AVAILABILITY MULTI-STUN WEBRTC CONFIG FOR CROSS-PLATFORM MOBILES
    const peerConfig = { 
      host: 'teams-6yw1.onrender.com', port: 443, path: '/', secure: true, 
      config: { 
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' }
        ] 
      } 
    };

    let audioCtx = null;
    function getAudioContext() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } if (audioCtx.state === 'suspended') { audioCtx.resume(); } return audioCtx; }
    function playToneNote(freq, type, duration, delay = 0, vol = 0.3) { const ctx = getAudioContext(); setTimeout(() => { if (!ctx) return; const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime); gain.gain.setValueAtTime(vol, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + duration); }, delay); }
    function playFriendOnlineSound() { playToneNote(523.25, 'sine', 0.15, 0); playToneNote(659.25, 'sine', 0.25, 100); }
    function playMessageAlertSound() { playToneNote(1200, 'sine', 0.05, 0, 0.4); }
    function playCallRingtone() { playToneNote(587.33, 'triangle', 0.15, 0, 0.35); playToneNote(880, 'triangle', 0.15, 180, 0.35); }

    function startRingtoneLoop() { stopRingtoneLoop(); playCallRingtone(); ringtoneInterval = setInterval(playCallRingtone, 2200); }
    function stopRingtoneLoop() { if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; } }
    function getTimeStamp() { const now = new Date(); return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

    function handlePageClose() { if(peer) peer.destroy(); }
    function handleKeyInput(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }

    function toggleTimerDropdown(e) { e.stopPropagation(); closeSettingsMenu(); const d = document.getElementById('timer-dropdown'); d.style.display = d.style.display === 'flex' ? 'none' : 'flex'; }
    function closeTimerDropdown() { document.getElementById('timer-dropdown').style.display = 'none'; }
    function selectTimer(secs, label) {
      destructInterval = secs; document.getElementById('timer-label').innerText = label;
      document.querySelectorAll('.timer-option').forEach(el => el.classList.remove('selected'));
      event.currentTarget.classList.add('selected'); closeTimerDropdown();
      if (activeConn && activeConn.open) activeConn.send({ type: 'cmd', command: 'set_destruct', value: destructInterval });
    }

    function openReactionBar(msgId, e) {
      e.stopPropagation(); activeReactionMsgId = msgId;
      const bar = document.getElementById('reaction-bar'); bar.style.display = 'flex';
      const rect = e.currentTarget.getBoundingClientRect();
      bar.style.top = (rect.top - 40) + 'px';
      bar.style.left = Math.min(Math.max(rect.left + (rect.width/2), 100), window.innerWidth - 100) + 'px';
    }
    function closeReactionBar() { document.getElementById('reaction-bar').style.display = 'none'; activeReactionMsgId = null; }
    function sendReaction(emoji, e) {
      e.stopPropagation(); if(!activeReactionMsgId) return;
      applyReaction(activeReactionMsgId, emoji);
      const payload = { type: 'reaction', msgId: activeReactionMsgId, emoji: emoji };
      if (activeConn && activeConn.open) { activeConn.send(payload); }
      closeReactionBar();
    }
    function applyReaction(msgId, emoji) {
      const msgDiv = document.getElementById(msgId); if(!msgDiv) return;
      let rContainer = msgDiv.querySelector('.reactions-container');
      if(!rContainer) { rContainer = document.createElement('div'); rContainer.className = 'reactions-container'; msgDiv.appendChild(rContainer); }
      rContainer.innerHTML = `<span>${emoji}</span>`;
    }

    function handleMessageClick(msgId, isMe, e) {
      if (!isMe) { openReactionBar(msgId, e); return; }
      let action = prompt("Choose action:\n1. Edit message\n2. React with emoji", "1");
      if (action === "1") {
        let msgDiv = document.getElementById(msgId);
        let textSpan = msgDiv.querySelector('.msg-text');
        let oldText = textSpan ? textSpan.innerText : "";
        let newText = prompt("Edit your message:", oldText);
        if (newText !== null && newText.trim() !== "") {
          updateEditedMessage(msgId, newText, true);
          if (activeConn && activeConn.open) { activeConn.send({ type: 'edit_msg', msgId: msgId, text: newText }); }
        }
      } else { openReactionBar(msgId, e); }
    }
    function updateEditedMessage(msgId, newText, isMe) {
      let msgDiv = document.getElementById(msgId); if (!msgDiv) return;
      let textSpan = msgDiv.querySelector('.msg-text');
      if (textSpan) {
        textSpan.innerText = newText;
        let editedTag = msgDiv.querySelector('.edited-tag');
        if (!editedTag) {
          let meta = msgDiv.querySelector('.msg-meta');
          let tag = document.createElement('span'); tag.className = 'edited-tag'; tag.style.cssText = "font-size:0.65rem; opacity:0.6; margin-right:4px;"; tag.innerText = "(edited)";
          meta.insertBefore(tag, meta.firstChild);
        }
      }
    }

    /* MS TEAMS CALL CONTROLS */
    function toggleTeamsMic() {
      if (!localStream) return; isCallMuted = !isCallMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !isCallMuted);
      const btn = document.getElementById('call-mic-btn');
      btn.innerHTML = isCallMuted ? `<i data-lucide="mic-off"></i>` : `<i data-lucide="mic"></i>`;
      document.getElementById('mic-lbl').innerText = isCallMuted ? "Mic Off" : "Mic On";
      isCallMuted ? btn.classList.add('active-off') : btn.classList.remove('active-off');
      lucide.createIcons();
    }

    function toggleTeamsCam() {
      if (!localStream || currentCallType !== 'video') return; isCamOff = !isCamOff;
      localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
      const btn = document.getElementById('call-cam-btn');
      btn.innerHTML = isCamOff ? `<i data-lucide="camera-off"></i>` : `<i data-lucide="camera"></i>`;
      document.getElementById('cam-lbl').innerText = isCamOff ? "Video Off" : "Video On";
      document.getElementById('local-video').style.opacity = isCamOff ? "0" : "1";
      isCamOff ? btn.classList.add('active-off') : btn.classList.remove('active-off');
      lucide.createIcons();
    }

    function toggleSpeakerOutput() {
      isSpeakerOn = !isSpeakerOn;
      const ra = document.getElementById('remote-audio');
      if (ra) ra.muted = !isSpeakerOn;
      const btn = document.getElementById('call-speaker-btn');
      btn.innerHTML = isSpeakerOn ? `<i data-lucide="volume-2"></i>` : `<i data-lucide="volume-x"></i>`;
      isSpeakerOn ? btn.classList.remove('active-off') : btn.classList.add('active-off');
      lucide.createIcons();
    }

    function toggleLocalVideoVisibility() {
      const container = document.getElementById('local-video-container');
      container.style.display = (container.style.display === 'none') ? 'block' : 'none';
    }

    function startCallTimer() {
      callSeconds = 0; if (callDurationTimer) clearInterval(callDurationTimer);
      document.getElementById('call-duration').innerText = "00:00";
      callDurationTimer = setInterval(() => {
        callSeconds++;
        const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const s = String(callSeconds % 60).padStart(2, '0');
        document.getElementById('call-duration').innerText = `${m}:${s}`;
      }, 1000);
    }

    function showCallUI(type, isCaller) {
      document.getElementById('call-ui').style.display = 'flex';
      const audioStage = document.getElementById('audio-only-ui');
      const remoteVideo = document.getElementById('remote-video');
      const localContainer = document.getElementById('local-video-container');

      if (type === 'video') {
        remoteVideo.style.display = 'block'; audioStage.style.display = 'none'; localContainer.style.display = 'block';
        document.getElementById('cam-lbl').innerText = "Video On";
        document.getElementById('call-cam-btn').classList.remove('active-off');
        document.getElementById('call-cam-btn').innerHTML = `<i data-lucide="camera"></i>`;
      } else {
        remoteVideo.style.display = 'none'; audioStage.style.display = 'flex'; localContainer.style.display = 'none';
        document.getElementById('cam-lbl').innerText = "Video Off";
        document.getElementById('call-cam-btn').classList.add('active-off');
        document.getElementById('call-cam-btn').innerHTML = `<i data-lucide="camera-off"></i>`;
      }
      
      document.getElementById('call-ui-subtext').innerText = isCaller ? "Calling..." : "Connecting...";
      isCallMuted = false; isCamOff = (type !== 'video');
      lucide.createIcons();
    }

    function dialVoiceCall() {
      if (!activeConn || !activeConn.open || !friendDynamicId) return alert('Friend offline!');
      currentCallType = 'voice'; getAudioContext();
      navigator.mediaDevices.getUserMedia(voiceOnlyConstraints).then(stream => {
        localStream = stream;
        activeCall = peer.call(friendDynamicId, localStream, { metadata: { type: 'voice' } }); 
        setupCallHandlers(activeCall, 'voice'); showCallUI('voice', true);
      }).catch(err => { alert("Microphone access required."); });
    }

    function dialVideoCall() {
      if (!activeConn || !activeConn.open || !friendDynamicId) return alert('Friend offline!');
      currentCallType = 'video'; getAudioContext();
      navigator.mediaDevices.getUserMedia(videoCallConstraints).then(stream => {
        localStream = stream; document.getElementById('local-video').srcObject = stream;
        activeCall = peer.call(friendDynamicId, localStream, { metadata: { type: 'video' } }); 
        setupCallHandlers(activeCall, 'video'); showCallUI('video', true);
      }).catch(err => { alert("Camera access required."); });
    }

    function setupCallHandlers(callObj, type) {
      callObj.on('stream', remoteStream => {
        const rv = document.getElementById('remote-video'); 
        const ra = document.getElementById('remote-audio');
        
        if (type === 'video') { 
          rv.srcObject = remoteStream; rv.muted = true; rv.play().catch(e=>{});
          rv.style.display = 'block'; document.getElementById('audio-only-ui').style.display = 'none';
        } else { rv.srcObject = null; }
        
        ra.srcObject = remoteStream; ra.muted = false; ra.play().catch(e=>{});
        document.getElementById('call-ui-subtext').innerText = "Connected";
        startCallTimer();
      });
      callObj.on('close', endTeamsCall); callObj.on('error', endTeamsCall);
    }

    function acceptCall() {
      getAudioContext(); stopInternalRingtone();
      document.getElementById('ring-overlay').style.display = 'none';
      isAnsweringCall = true;
      const constraints = currentCallType === 'video' ? videoCallConstraints : voiceOnlyConstraints;
      navigator.mediaDevices.getUserMedia(constraints).then(stream => { 
        localStream = stream; 
        if(currentCallType === 'video') document.getElementById('local-video').srcObject = stream; 
        showCallUI(currentCallType, false); 
        if (incomingCallObj) { 
          incomingCallObj.answer(localStream); 
          setupCallHandlers(incomingCallObj, currentCallType); 
          isAnsweringCall = false;
        } 
      }).catch(err => { alert("Media permissions denied."); rejectCall(); });
    }

    function rejectCall() { stopInternalRingtone(); document.getElementById('ring-overlay').style.display = 'none'; isAnsweringCall = false; if (incomingCallObj) { incomingCallObj.close(); incomingCallObj = null; } }

    function endTeamsCall() {
      if (activeCall) { activeCall.close(); activeCall = null; }
      if (incomingCallObj) { incomingCallObj.close(); incomingCallObj = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      document.getElementById('call-ui').style.display = 'none';
      document.getElementById('remote-video').srcObject = null; document.getElementById('remote-audio').srcObject = null; document.getElementById('local-video').srcObject = null;
      if(callDurationTimer) clearInterval(callDurationTimer);
      if(activeConn && activeConn.open) activeConn.send({ type: 'end_call' });
      isAnsweringCall = false;
    }

    function toggleFriendCallAccess() {
      closeSettingsMenu(); isFriendCallAllowed = !isFriendCallAllowed; const btn = document.getElementById('item-call-access');
      btn.innerHTML = `<i data-lucide="phone-call"></i> Allow Friend Calls: ${isFriendCallAllowed ? 'ON' : 'OFF'}`;
      isFriendCallAllowed ? btn.classList.add('active-mode') : btn.classList.remove('active-mode');
      if (activeConn && activeConn.open) activeConn.send({ type: 'cmd', command: 'set_friend_call_access', value: isFriendCallAllowed });
      lucide.createIcons();
    }

    function toggleHeaderVisibility() {
      closeSettingsMenu(); isHeaderVisible = !isHeaderVisible; const btn = document.getElementById('item-header-vis');
      btn.innerHTML = `<i data-lucide="${isHeaderVisible ? 'eye' : 'eye-off'}"></i> Show Header: ${isHeaderVisible ? 'ON' : 'OFF'}`;
      isHeaderVisible ? btn.classList.add('active-mode') : btn.classList.remove('active-mode');
      if (activeConn && activeConn.open) activeConn.send({ type: 'cmd', command: 'set_header_visibility', value: isHeaderVisible });
      lucide.createIcons();
    }

    function adminLogin() {
      const u = document.getElementById('admin-user').value.trim();
      const p = document.getElementById('admin-pass').value.trim();
      if (u === 'admin' && p === 'admin') {
        document.getElementById('login-modal').style.display = 'none';
        document.getElementById('chat-drawer').style.display = 'flex';
        initAdminSession(); loadPersistentChatHistory(); lucide.createIcons();
      } else { alert('Invalid Credentials!'); }
    }

    function toggleSettingsMenu(e) { e.stopPropagation(); const m = document.getElementById('settings-menu'); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; }
    function closeSettingsMenu() { document.getElementById('settings-menu').style.display = 'none'; }

    function initAdminSession() {
      if (peer) peer.destroy(); peer = new Peer(ADMIN_ID, peerConfig);
      peer.on('open', () => { updateConnectionStatus(false); });
      peer.on('error', (err) => { if (err.type === 'unavailable-id') setTimeout(initAdminSession, 2000); });
      peer.on('connection', incoming => { setupConnection(incoming); });
      
      // DIRECT WEBRTC CALL HANDSHAKE
      peer.on('call', call => {
        incomingCallObj = call; currentCallType = (call.metadata && call.metadata.type) ? call.metadata.type : 'voice';
        if (isAnsweringCall && localStream) {
          call.answer(localStream); setupCallHandlers(call, currentCallType); isAnsweringCall = false;
        } else {
          document.getElementById('ring-title').innerText = "Incoming " + (currentCallType === 'video' ? 'Video' : 'Audio') + " Call";
          document.getElementById('ring-overlay').style.display = 'flex'; startRingtoneLoop();
        }
      });
    }

    function setupConnection(conn) {
      if (activeConn && activeConn.open) { activeConn.close(); } activeConn = conn; friendDynamicId = conn.peer; 
      updateConnectionStatus(true);
      
      const onReady = () => {
        updateConnectionStatus(true); playFriendOnlineSound();
        activeConn.send({ type: 'cmd', command: 'set_friend_call_access', value: isFriendCallAllowed }); 
        activeConn.send({ type: 'cmd', command: 'set_header_visibility', value: isHeaderVisible }); 
      };
      if (conn.open) onReady(); else conn.on('open', onReady);

      conn.on('data', data => {
        if (typeof data === 'object') {
          if (data.type === 'typing_preview') { 
            const tb = document.getElementById('typing-indicator-box'); const pt = document.getElementById('typing-preview-text'); 
            if (data.text && data.text.length > 0) { tb.style.display = 'flex'; pt.innerText = data.text; } else { tb.style.display = 'none'; pt.innerText = ''; } 
          }
          else if (data.type === 'reaction') { applyReaction(data.msgId, data.emoji); }
          else if (data.type === 'edit_msg') { updateEditedMessage(data.msgId, data.text, false); }
          else if (data.type === 'file') { playMessageAlertSound(); renderFileMessage(data, false); saveChatMessageToPersistentStorage(data, false); }
          else if (data.type === 'msg') {
            document.getElementById('typing-indicator-box').style.display = 'none'; playMessageAlertSound();
            addMessage(data.text, false, data.time || getTimeStamp(), data.id); saveChatMessageToPersistentStorage(data, false);
          }
          else if (data.type === 'end_call') { endTeamsCall(); }
        } else if (typeof data === 'string') { playMessageAlertSound(); addMessage(data, false, getTimeStamp()); }
      });

      const onDisconnect = () => { activeConn = null; friendDynamicId = null; updateConnectionStatus(false); stopRingtoneLoop(); };
      conn.on('close', onDisconnect); conn.on('error', onDisconnect);
    }

    function updateConnectionStatus(isOnline) { const dot = document.getElementById('status-dot'); const text = document.getElementById('status-text'); if (isOnline) { dot.classList.add('online'); text.innerText = "Online"; } else { dot.classList.remove('online'); text.innerText = "Waiting..."; } }

    function saveChatMessageToPersistentStorage(msgObj, isMe) { let history = JSON.parse(localStorage.getItem('admin_permanent_chat_history') || '[]'); if (msgObj.id && history.some(item => item.id === msgObj.id)) return; history.push({ ...msgObj, isMe }); localStorage.setItem('admin_permanent_chat_history', JSON.stringify(history)); }
    function loadPersistentChatHistory() { let history = JSON.parse(localStorage.getItem('admin_permanent_chat_history') || '[]'); document.getElementById('messages').innerHTML = ''; history.forEach(item => { if (item.type === 'file') renderFileMessageFromStorage(item, item.isMe); else addMessage(item.text || item, item.isMe, item.time || getTimeStamp(), item.id); }); }
    function renderFileMessageFromStorage(fileObj, isMe) { const div = document.createElement('div'); div.className = 'msg ' + (isMe ? 'me' : ''); div.setAttribute('onclick', `handleMessageClick('${fileObj.id || 'msg_f_'+Date.now()}', ${isMe}, event)`); div.id = fileObj.id || 'msg_f_'+Date.now(); let cHTML = `<div style="font-size:0.8rem; font-weight:600; margin-bottom:4px;"><i data-lucide="paperclip" style="width:14px;"></i> ${fileObj.name}</div>`; if (fileObj.mime && fileObj.mime.startsWith('image/')) cHTML += `<img src="${fileObj.data}" alt="attachment" />`; else if (fileObj.mime && fileObj.mime.startsWith('video/')) cHTML += `<video src="${fileObj.data}" controls></video>`; cHTML += `<a href="${fileObj.data}" download="${fileObj.name}" style="color:#30d158; font-size:0.75rem; display:block; margin-top:8px; text-decoration:none; font-weight:600;"><i data-lucide="download" style="width:14px;"></i> Download</a><div class="msg-meta"><span class="msg-time">${fileObj.time || getTimeStamp()}</span></div>`; div.innerHTML = cHTML; const box = document.getElementById('messages'); box.appendChild(div); box.scrollTop = box.scrollHeight; lucide.createIcons(); }
    function sendFile(input) { const file = input.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { const msgId = 'msg_a_' + Date.now(); const fileData = { type: 'file', name: file.name, mime: file.type, data: e.target.result, time: getTimeStamp(), id: msgId }; if (activeConn && activeConn.open) activeConn.send(fileData); renderFileMessage(fileData, true); saveChatMessageToPersistentStorage(fileData, true); input.value = ''; }; reader.readAsDataURL(file); }
    function renderFileMessage(fileObj, isMe) { const div = document.createElement('div'); div.className = 'msg ' + (isMe ? 'me' : ''); div.setAttribute('onclick', `handleMessageClick('${fileObj.id}', ${isMe}, event)`); div.id = fileObj.id; let cHTML = `<div style="font-size:0.8rem; font-weight:600; margin-bottom:4px;"><i data-lucide="paperclip" style="width:14px;"></i> ${fileObj.name}</div>`; if (fileObj.mime.startsWith('image/')) cHTML += `<img src="${fileObj.data}" alt="attachment" />`; else if (fileObj.mime.startsWith('video/')) cHTML += `<video src="${fileObj.data}" controls></video>`; cHTML += `<a href="${fileObj.data}" download="${fileObj.name}" style="color:#30d158; font-size:0.75rem; display:block; margin-top:8px; text-decoration:none; font-weight:600;"><i data-lucide="download" style="width:14px;"></i> Download</a><div class="msg-meta"><span class="msg-time">${fileObj.time || getTimeStamp()}</span></div>`; div.innerHTML = cHTML; const box = document.getElementById('messages'); box.appendChild(div); box.scrollTop = box.scrollHeight; lucide.createIcons(); }

    function sendMessage() { 
      const input = document.getElementById('chat-input'); const msg = input.value.trim(); if (!msg) return; 
      const currentTime = getTimeStamp(); const msgId = 'msg_' + Date.now(); const msgObj = { type: 'msg', text: msg, destruct: destructInterval, time: currentTime, id: msgId }; 
      if (activeConn && activeConn.open) activeConn.send(msgObj); 
      addMessage(msg, true, currentTime, msgId); saveChatMessageToPersistentStorage(msgObj, true); 
      input.value = ''; input.style.height = 'auto';
    }
    
    function addMessage(msg, isMe, timeStr, msgId) { 
      const div = document.createElement('div'); div.className = 'msg ' + (isMe ? 'me' : ''); 
      if (msgId) { div.id = msgId; div.setAttribute('onclick', `handleMessageClick('${msgId}', ${isMe}, event)`); }
      let mHTML = `<div class="msg-meta"><span class="msg-time">${timeStr || getTimeStamp()}</span></div>`; 
      div.innerHTML = `<span class="msg-text">${msg}</span>` + mHTML; 
      const box = document.getElementById('messages'); box.appendChild(div); box.scrollTop = box.scrollHeight; lucide.createIcons(); 
    }
  </script>
</body>
