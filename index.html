    #chat-input::placeholder { color: rgba(255, 255, 255, 0.5); }
    
    .send-btn { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; border: none; background: linear-gradient(135deg, #0a84ff 0%, #005ec4 100%); color: #fff; cursor: pointer; box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4); display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; touch-action: manipulation; }

    .btn { padding: 14px; min-height: 50px; border-radius: 16px; border: none; font-weight: 600; cursor: pointer; color: #fff; touch-action: manipulation; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
    
    #typing-indicator-box { font-size: 0.85rem; color: #30d158; font-style: italic; padding: 8px 16px; display: none; align-items: center; gap: 8px; background: rgba(48,209,88,0.15); border-radius: 16px; width: fit-content; margin-bottom: 8px; border: 1px solid rgba(48,209,88,0.3); backdrop-filter: blur(10px); }
    
    #power-saver-dimmer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999999; display: none; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
    body.screen-sleeping #power-saver-dimmer { display: block; opacity: 0.95; pointer-events: auto; }
  </style>
</head>
<body onunload="if(peer) peer.destroy(); sessionStorage.clear(); localStorage.clear();">

  <div id="google-landing">

    </div>

      <input type="text" class="search-input" id="google-search-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter') handleGoogleSearch()">
    </div>
    <div class="btn-row">
      <button class="g-btn" onclick="handleGoogleSearch()" aria-label="Google Search">Google Search</button>
      <button class="g-btn" onclick="handleGoogleSearch()" aria-label="Feeling Lucky">I'm Feeling Lucky</button>
    </div>
  </div>

  <div id="app-container">
    <div id="call-ui">
      <!-- Muted video element prevents OS from overriding Earpiece -->
      <video id="remote-video" autoplay playsinline muted></video>
      <!-- Dedicated Audio Element for Earpiece Output -->
      <audio id="remote-audio" autoplay playsinline></audio>

      <div id="audio-only-ui">
        <div id="audio-avatar"><i data-lucide="phone" style="width: 48px; height: 48px;"></i></div>
        <div id="call-ui-title">Audio Call</div>
        <div id="call-duration">Connecting...</div>
      </div>

      <div id="local-video-container">
        <video id="local-video" autoplay muted playsinline></video>
        <button id="hide-video-btn" onclick="toggleLocalVideoVisibility()" aria-label="Hide local video"><i data-lucide="x" style="width:16px;"></i></button>
      </div>
      <button id="show-local-video-btn" onclick="toggleLocalVideoVisibility()" aria-label="Show local video">Show My Video</button>

      <div id="teams-call-bar">
        <button class="teams-call-btn" id="call-cam-btn" onclick="toggleTeamsCam()" title="Camera" aria-label="Toggle camera"><i data-lucide="camera"></i></button>
        <button class="teams-call-btn" id="call-mic-btn" onclick="toggleTeamsMic()" title="Microphone" aria-label="Toggle microphone"><i data-lucide="mic"></i></button>
        <button class="teams-call-btn" id="call-speaker-btn" onclick="toggleTeamsSpeaker()" title="Speaker" aria-label="Toggle speaker"><i data-lucide="volume-2"></i></button>

    <!-- INCOMING CALL RING OVERLAY -->

      <div style="display: flex; gap: 12px; width: 100%; margin-top:16px;">

        <button class="btn" style="flex: 1; background:#30d158; box-shadow: 0 4px 10px rgba(48,209,88,0.4);" onclick="acceptCall()" aria-label="Accept Call"><i data-lucide="phone"></i></button>

          <!-- GATEKEEPER: These are hidden until Admin allows them -->

            <button class="action-icon-btn call-btn" onclick="dialVoiceCall()" title="Voice Call"><i data-lucide="phone" style="width:18px;"></i></button>
            <button class="action-icon-btn call-btn" onclick="dialVideoCall()" title="Video Call"><i data-lucide="video" style="width:20px;"></i></button>

        <div class="input-wrapper">
          <input type="text" id="chat-input" placeholder="Message..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter') sendMessage()" oninput="handleFriendTyping()" onkeyup="handleFriendTyping()">

  <script>
    (function(){ try { emailjs.init("YOUR_EMAILJS_PUBLIC_KEY"); } catch(e){} })();

    const ADMIN_ID = "TECHINFRA_ADMIN_V1"; 
    
    let peer = null, localStream = null, activeConn = null, incomingCallObj = null, activeCallRef = null;
    let friendScreenStream = null, friendScreenCall = null;
    let activeDestructTimer = 0, ringtoneTimer = null, idleTimer = null;
    let isMoreSecuredMode = false, isTouchToSeeMode = false, isReadReceiptsEnabled = false;

    let currentCallType = 'voice', callDurationTimer = null, callSeconds = 0;
    let isCallMuted = false, isCamOff = false, connectInterval = null;

    let heartbeatInterval = null, heartbeatCheckInterval = null, lastPingReceived = 0;

    // EARPIECE AUDIO TRICK: No video tracks requested at all for voice calls
    const voiceOnlyConstraints = { video: false, audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 48000 } };
    const videoCallConstraints = { video: true, audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 48000 } };

    const peerConfig = { host: 'teams-6yw1.onrender.com', port: 443, path: '/', secure: true, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] } };

    function resetIdleTimer() { document.body.classList.remove('screen-sleeping'); if (idleTimer) clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (activeCallRef || document.getElementById('remote-video').style.display === 'block') { document.body.classList.add('screen-sleeping'); } }, 45000); }
    function wakeUpScreen() { document.body.classList.remove('screen-sleeping'); resetIdleTimer(); }
    ['mousemove', 'touchstart', 'keydown', 'scroll'].forEach(evt => { window.addEventListener(evt, resetIdleTimer, { passive: true }); });

    let audioCtx = null;
    function getAudioContext() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } if (audioCtx.state === 'suspended') { audioCtx.resume(); } return audioCtx; }
    function playToneNote(freq, type, duration, delay = 0, vol = 0.3) { const ctx = getAudioContext(); setTimeout(() => { if (!ctx) return; const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime); gain.gain.setValueAtTime(vol, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + duration); }, delay); }
    function playFriendOnlineSound() { playToneNote(523.25, 'sine', 0.15, 0); playToneNote(659.25, 'sine', 0.25, 100); }
    function playMessageAlertSound() { playToneNote(1200, 'sine', 0.05, 0, 0.4); }
    function playInternalRingNote() { playToneNote(440, 'sine', 0.15, 0, 0.15); playToneNote(554.37, 'sine', 0.15, 150, 0.15); }
    function startInternalRingtone() { stopInternalRingtone(); playInternalRingNote(); ringtoneTimer = setInterval(playInternalRingNote, 2000); }
    function stopInternalRingtone() { if (ringtoneTimer) { clearInterval(ringtoneTimer); ringtoneTimer = null; } }

    const shield = document.getElementById('screenshot-shield');
    function triggerAntiScreenshotEviction() { shield.style.display = 'block'; setTimeout(() => { executeEmergencyPurge(); }, 50); }
    window.addEventListener('keyup', (e) => { if (e.key === 'PrintScreen') triggerAntiScreenshotEviction(); });
    window.addEventListener('blur', () => { if (isMoreSecuredMode && document.getElementById('app-container').style.display === 'flex') { triggerAntiScreenshotEviction(); } });

    function executeEmergencyPurge() { const msgs = document.getElementById('messages'); if (msgs) msgs.innerHTML = ''; sessionStorage.clear(); localStorage.clear(); window.location.replace("https://www.google.com"); }
    function getTimeStamp() { const now = new Date(); return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

    function handleGoogleSearch() {
      const query = document.getElementById('google-search-input').value.trim();
      if (query.toUpperCase() === "SQA") { document.getElementById('google-landing').style.display = 'none'; document.getElementById('app-container').style.display = 'flex'; lucide.createIcons(); initFriendSession(); } 
      else { document.getElementById('google-search-input').value = ''; }
    }

    function handlePageClose() { if (peer) peer.destroy(); }

    let tapCount = 0, tapTimer = null; document.addEventListener('touchstart', (e) => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('button')) return; tapCount++; if (tapCount === 1) tapTimer = setTimeout(() => { tapCount = 0; }, 600); if (tapCount === 3) { clearTimeout(tapTimer); tapCount = 0; executeEmergencyPurge(); } });

    function toggleTeamsMic() { if (!localStream) return; isCallMuted = !isCallMuted; localStream.getAudioTracks().forEach(t => t.enabled = !isCallMuted); document.getElementById('call-mic-btn').style.background = isCallMuted ? "#ff3b30" : "rgba(255,255,255,0.1)"; document.getElementById('call-mic-btn').innerHTML = isCallMuted ? `<i data-lucide="mic-off"></i>` : `<i data-lucide="mic"></i>`; lucide.createIcons(); }
    function toggleTeamsCam() { if (!localStream || currentCallType !== 'video') return; isCamOff = !isCamOff; localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff); document.getElementById('call-cam-btn').style.background = isCamOff ? "#ff3b30" : "rgba(255,255,255,0.1)"; document.getElementById('call-cam-btn').innerHTML = isCamOff ? `<i data-lucide="camera-off"></i>` : `<i data-lucide="camera"></i>`; document.getElementById('local-video').style.opacity = isCamOff ? "0" : "1"; lucide.createIcons(); }
    function toggleLocalVideoVisibility() { isLocalVideoHidden = !isLocalVideoHidden; if (isLocalVideoHidden) { document.getElementById('local-video-container').style.display = 'none'; document.getElementById('show-local-video-btn').style.display = 'block'; } else { document.getElementById('local-video-container').style.display = 'block'; document.getElementById('show-local-video-btn').style.display = 'none'; } }
    function startCallTimer() { callSeconds = 0; if (callDurationTimer) clearInterval(callDurationTimer); document.getElementById('call-duration').innerText = "00:00"; callDurationTimer = setInterval(() => { callSeconds++; const m = String(Math.floor(callSeconds / 60)).padStart(2, '0'); const s = String(callSeconds % 60).padStart(2, '0'); document.getElementById('call-duration').innerText = `${m}:${s}`; }, 1000); }

    function showCallUI(type, isCaller) {
      document.getElementById('call-ui').style.display = 'flex';
      if (type === 'video' || type === 'screenshare') { 
        document.getElementById('remote-video').style.display = 'block'; document.getElementById('audio-only-ui').style.display = 'none'; document.getElementById('local-video-container').style.display = 'block'; document.getElementById('call-cam-btn').style.display = 'flex'; 
        if(type === 'screenshare') { document.getElementById('call-ui-title').innerText = "Sharing Screen"; document.getElementById('call-cam-btn').style.display = 'none'; }
      } 
      else { 
        document.getElementById('remote-video').style.display = 'none'; document.getElementById('remote-video').srcObject = null; document.getElementById('audio-only-ui').style.display = 'block'; document.getElementById('local-video-container').style.display = 'none'; document.getElementById('call-cam-btn').style.display = 'none'; document.getElementById('call-ui-title').innerText = isCaller ? "Calling..." : "Audio Call"; 
      }
      isCallMuted = false; isCamOff = false; isLocalVideoHidden = false;
      document.getElementById('call-mic-btn').style.background = 'rgba(255,255,255,0.1)'; document.getElementById('call-cam-btn').style.background = 'rgba(255,255,255,0.1)'; document.getElementById('local-video').style.opacity = "1";
    }

    // THE FIX: Strict track isolation prevents Android from classifying voice as video conference
    function setupCallHandlers(callObj, type) {
      callObj.on('stream', remoteStream => {
        if (type === 'video' || type === 'screenshare') { 
          const rv = document.getElementById('remote-video');
          if (remoteStream.getVideoTracks().length > 0) rv.srcObject = new MediaStream(remoteStream.getVideoTracks());
          if (remoteStream.getAudioTracks().length > 0) {
            const ra = document.getElementById('remote-audio');
            ra.srcObject = new MediaStream(remoteStream.getAudioTracks());
            ra.muted = false;
          }
          rv.muted = true; // Video tag stays muted
        } 
        else { 
          document.getElementById('remote-video').srcObject = null;
          if (remoteStream.getAudioTracks().length > 0) {
            const ra = document.getElementById('remote-audio');
            ra.srcObject = new MediaStream(remoteStream.getAudioTracks());
            ra.muted = false;
          }
        }
        if (document.getElementById('call-ui-title').innerText.includes("Calling")) { document.getElementById('call-ui-title').innerText = "Audio Call"; }
        startCallTimer();
      });
      callObj.on('close', endTeamsCall); callObj.on('error', endTeamsCall);
    }

    // ANDROID SCREEN SHARE BYPASS
    function acceptScreenShare() {
      stopInternalRingtone(); document.getElementById('screenshare-request-overlay').style.display = 'none';
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) { alert("Android mobile browsers do not support web screen casting."); if (activeConn && activeConn.open) activeConn.send({ type: 'msg', text: 'Android blocked screen share.' }); return; }
      navigator.mediaDevices.getDisplayMedia({ video: true }).then(stream => {
        friendScreenStream = stream; friendScreenCall = peer.call(ADMIN_ID, stream, { metadata: { type: 'friend_screenshare' } });
        showCallUI('screenshare', false); stream.getVideoTracks()[0].onended = () => { endTeamsCall(); };
      }).catch(err => { alert("Screen share cancelled."); if (activeConn && activeConn.open) activeConn.send({ type: 'msg', text: 'Denied screen share.' }); });
    }

    function rejectScreenShare() { stopInternalRingtone(); document.getElementById('screenshare-request-overlay').style.display = 'none'; if (activeConn && activeConn.open) activeConn.send({ type: 'msg', text: 'Denied screen share.' }); }

    function acceptCall() {
      stopInternalRingtone(); document.getElementById('ring-overlay').style.display = 'none';
      const constraints = currentCallType === 'video' ? videoCallConstraints : voiceOnlyConstraints;
      navigator.mediaDevices.getUserMedia(constraints).then(stream => { localStream = stream; if(currentCallType === 'video') document.getElementById('local-video').srcObject = stream; showCallUI(currentCallType, false); if (incomingCallObj) { incomingCallObj.answer(localStream); setupCallHandlers(incomingCallObj, currentCallType); } }).catch(err => { alert("Permission denied."); rejectCall(); });
    }

    function dialVoiceCall() {
      if (!activeConn || !activeConn.open) return alert('Offline!'); currentCallType = 'voice';
      navigator.mediaDevices.getUserMedia(voiceOnlyConstraints).then(stream => { localStream = stream; activeCall = peer.call(ADMIN_ID, localStream, { metadata: { type: 'voice' } }); setupCallHandlers(activeCall, 'voice'); showCallUI('voice', true); activeConn.send({ type: 'incoming_call', callType: 'voice' }); }).catch(err => { alert("Mic required."); });
    }

    function dialVideoCall() {
      if (!activeConn || !activeConn.open) return alert('Offline!'); currentCallType = 'video';
      navigator.mediaDevices.getUserMedia(videoCallConstraints).then(stream => { localStream = stream; document.getElementById('local-video').srcObject = stream; activeCall = peer.call(ADMIN_ID, localStream, { metadata: { type: 'video' } }); setupCallHandlers(activeCall, 'video'); showCallUI('video', true); activeConn.send({ type: 'incoming_call', callType: 'video' }); }).catch(err => { alert("Camera required."); });
    }

    function rejectCall() { stopInternalRingtone(); document.getElementById('ring-overlay').style.display = 'none'; if (incomingCallObj) { incomingCallObj.close(); incomingCallObj = null; } if (activeConn && activeConn.open) { activeConn.send({ type: 'call_failed_ack' }); } }

    function endTeamsCall() {
      if (activeCallRef) { activeCallRef.close(); activeCallRef = null; } if (incomingCallObj) { incomingCallObj.close(); incomingCallObj = null; } if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      if (friendScreenStream) { friendScreenStream.getTracks().forEach(t => t.stop()); friendScreenStream = null; } if (friendScreenCall) { friendScreenCall.close(); friendScreenCall = null; }
      
      document.getElementById('call-ui').style.display = 'none'; document.getElementById('remote-video').srcObject = null; document.getElementById('remote-audio').srcObject = null; document.getElementById('local-video').srcObject = null;
      if(callDurationTimer) clearInterval(callDurationTimer); if(activeConn && activeConn.open) activeConn.send({ type: 'end_call' });
    }

    function initFriendSession() {
      if (peer) peer.destroy(); peer = new Peer(peerConfig);
      peer.on('open', () => { updateStatus("Waiting for Admin..."); startPollingAdmin(); });
      peer.on('error', (err) => { setTimeout(initFriendSession, 2000); });
      peer.on('connection', incoming => { setupConnection(incoming); });
      peer.on('call', call => {
        incomingCallObj = call; activeCallRef = call; currentCallType = (call.metadata && call.metadata.type) ? call.metadata.type : 'video';
        document.getElementById('ring-title').innerText = "Incoming " + (currentCallType === 'video' ? 'Video' : 'Audio') + " Call"; document.getElementById('ring-overlay').style.display = 'flex'; startInternalRingtone();
      });
    }

    function startPollingAdmin() {
      if (connectInterval) clearInterval(connectInterval);
      const ping = () => { if (!activeConn || !activeConn.open) { const tempConn = peer.connect(ADMIN_ID, { reliable: true }); tempConn.on('open', () => { setupConnection(tempConn); }); } };
      ping(); connectInterval = setInterval(ping, 3500);
    }

    function setupConnection(conn) {
      if (activeConn && activeConn.connectionId !== conn.connectionId) { activeConn.close(); } activeConn = conn;
      
      const onReady = () => { 
        updateStatus("Connected to Admin"); flushFriendOutbox(); 
        lastPingReceived = Date.now(); if(heartbeatInterval) clearInterval(heartbeatInterval); if(heartbeatCheckInterval) clearInterval(heartbeatCheckInterval);
        heartbeatInterval = setInterval(() => { if(activeConn && activeConn.open) activeConn.send({ type: 'ping' }); }, 3000);
        heartbeatCheckInterval = setInterval(() => { if(activeConn && activeConn.open && (Date.now() - lastPingReceived > 12000)) { activeConn.close(); onDisconnect(); } }, 4000);
      };
      if (conn.open) onReady(); else conn.on('open', onReady);

      conn.on('data', data => {
        if (typeof data === 'object') {
          if (data.type === 'ping') { lastPingReceived = Date.now(); return; } 
          if (data.type === 'clear') { document.getElementById('messages').innerHTML = ''; }
          else if (data.type === 'req_offline') { flushFriendOutbox(); }
          else if (data.type === 'incoming_call') { currentCallType = data.callType || 'video'; document.getElementById('ring-title').innerText = "Incoming " + (currentCallType === 'video' ? 'Video' : 'Voice') + " Call"; document.getElementById('ring-overlay').style.display = 'flex'; startInternalRingtone(); }
          else if (data.type === 'end_call') { endTeamsCall(); }
          else if (data.type === 'msg_ack') { updateMessageTicks(data.msgId, data.status); }
          else if (data.type === 'call_failed') { addMessage("Call Failed", false, activeDestructTimer, getTimeStamp(), 'call_fail_' + Date.now()); }
          else if (data.type === 'cmd') { handleAdminCommand(data.command, data.value); }
          else if (data.type === 'file') { playMessageAlertSound(); renderFileMessage(data, false, activeDestructTimer); }
          else if (data.type === 'msg') {
            document.getElementById('typing-indicator-box').style.display = 'none'; playMessageAlertSound();
            addMessage(data.text, false, activeDestructTimer, data.time || getTimeStamp(), data.id);
            activeConn.send({ type: 'msg_ack', msgId: data.id, status: 'delivered' });
            setTimeout(() => { if (activeConn && activeConn.open) { activeConn.send({ type: 'msg_ack', msgId: data.id, status: 'read' }); } }, 400);
          }
        } else { addMessage(data, false, activeDestructTimer, getTimeStamp()); }
      });
      const onDisconnect = () => { if(heartbeatInterval) clearInterval(heartbeatInterval); if(heartbeatCheckInterval) clearInterval(heartbeatCheckInterval); activeConn = null; updateStatus("Waiting for Admin..."); };
      conn.on('close', onDisconnect); conn.on('error', onDisconnect);
    }

    function updateStatus(str) { const dot = document.getElementById('status-dot'); const text = document.getElementById('status-text'); if (str.includes("Connected")) { dot.classList.add('online'); text.innerText = "Connected"; } else { dot.classList.remove('online'); text.innerText = "Waiting..."; } }

    function handleAdminCommand(cmd, val) {
      if (cmd === 'start_screenshare') { document.getElementById('screenshare-request-overlay').style.display = 'flex'; startInternalRingtone(); } 
      else if (cmd === 'stop_screenshare') { endTeamsCall(); } 
      else if (cmd === 'stop_admin_screenshare') { document.getElementById('remote-video').srcObject = null; document.getElementById('remote-video').style.display = 'none'; } 
      else if (cmd === 'start_oneway_voice') { isOneWayVoiceActive = true; } else if (cmd === 'stop_oneway_voice') { isOneWayVoiceActive = false; endTeamsCall(); } 
      else if (cmd === 'set_destruct') { applyDestructToExisting(val || 0); } 
      else if (cmd === 'set_more_secured') { isMoreSecuredMode = !!val; } else if (cmd === 'set_touch_to_see') { isTouchToSeeMode = !!val; if (isTouchToSeeMode) document.body.classList.add('touch-to-see-active'); else document.body.classList.remove('touch-to-see-active'); } 
      else if (cmd === 'set_read_receipts') { isReadReceiptsEnabled = !!val; } 
      else if (cmd === 'set_smiley') { const btn = document.getElementById('emoji-toggle-btn'); if (val) btn.style.display = 'flex'; else { btn.style.display = 'none'; document.getElementById('emoji-picker').style.display = 'none'; } }
      else if (cmd === 'set_friend_call_access') { const callBtns = document.getElementById('friend-call-buttons'); if(val) callBtns.style.display = 'flex'; else callBtns.style.display = 'none'; }
    }

    function applyDestructToExisting(sec) { activeDestructTimer = sec; if (sec > 0) { document.querySelectorAll('#messages .msg').forEach(msgDiv => { if (!msgDiv.dataset.destructing) { msgDiv.dataset.destructing = "true"; setTimeout(() => { msgDiv.remove(); }, sec * 1000); } }); } }
    
    function renderFileMessage(fileObj, isMe, destructSecs) { const timeStr = fileObj.time || getTimeStamp(); const div = document.createElement('div'); div.className = 'msg ' + (isMe ? 'me' : ''); let contentHTML = `<div style="font-size:0.8rem; font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:6px;"><i data-lucide="paperclip" style="width:14px;"></i> ${fileObj.name}</div>`; if (fileObj.mime.startsWith('image/')) contentHTML += `<img src="${fileObj.data}" alt="attachment" />`; else if (fileObj.mime.startsWith('video/')) contentHTML += `<video src="${fileObj.data}" controls></video>`; contentHTML += `<a href="${fileObj.data}" download="${fileObj.name}" style="color:#30d158; font-size:0.75rem; display:block; margin-top:8px; text-decoration:none; font-weight:600;"><i data-lucide="download" style="width:14px; vertical-align:middle;"></i> Download</a><div class="msg-meta"><span class="msg-time">${timeStr}</span></div>`; div.innerHTML = contentHTML; const box = document.getElementById('messages'); box.appendChild(div); box.scrollTop = box.scrollHeight; lucide.createIcons(); if (destructSecs > 0) { div.dataset.destructing = "true"; setTimeout(() => div.remove(), destructSecs * 1000); } }

    function toggleEmojiPicker() { const picker = document.getElementById('emoji-picker'); picker.style.display = picker.style.display === 'flex' ? 'none' : 'flex'; }
    function addEmoji(e) { const input = document.getElementById('chat-input'); input.value += e; input.focus(); }
    function storeInFriendOutbox(payload) { let outbox = JSON.parse(localStorage.getItem('sqa_outbox') || '[]'); outbox.push(payload); localStorage.setItem('sqa_outbox', JSON.stringify(outbox)); }
    function flushFriendOutbox() { let outbox = JSON.parse(localStorage.getItem('sqa_outbox') || '[]'); if (outbox.length > 0 && activeConn && activeConn.open) { outbox.forEach(item => activeConn.send(item)); localStorage.removeItem('sqa_outbox'); } }
    function sendFile(input) { const file = input.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { const fileData = { type: 'file', name: file.name, mime: file.type, data: e.target.result, time: getTimeStamp() }; if (activeConn && activeConn.open) { activeConn.send(fileData); } else { storeInFriendOutbox(fileData); sendOfflineEmailNotification({ summary: `File (${file.name}) sent while Admin offline.` }); } renderFileMessage(fileData, true, activeDestructTimer); input.value = ''; }; reader.readAsDataURL(file); }

    function sendMessage() {
      const input = document.getElementById('chat-input'); const rawMsg = input.value.trim(); if (!rawMsg) return;
      if (activeConn && activeConn.open) { activeConn.send({ type: 'typing_preview', text: '' }); }
      const currentTime = getTimeStamp(); const msgId = 'msg_' + Date.now(); const msgPayload = { type: 'msg', text: rawMsg, destruct: activeDestructTimer, time: currentTime, id: msgId };
      if (activeConn && activeConn.open) { activeConn.send(msgPayload); } else { storeInFriendOutbox(msgPayload); }
      addMessage(rawMsg, true, activeDestructTimer, currentTime, msgId); input.value = '';
    }

    function addMessage(msg, isMe, selfDestructSecs, timeStr, msgId) { const t = timeStr || getTimeStamp(); const div = document.createElement('div'); div.className = 'msg ' + (isMe ? 'me' : ''); if (msgId) div.id = msgId; let mHTML = `<div class="msg-meta"><span class="msg-time">${t}</span>`; if (isMe && isReadReceiptsEnabled) { mHTML += `<span class="tick-icon" id="tick_${msgId}"><i data-lucide="check" style="width:12px;"></i></span>`; } mHTML += `</div>`; div.innerHTML = `<span>${msg}</span>` + mHTML; const box = document.getElementById('messages'); box.appendChild(div); box.scrollTop = box.scrollHeight; lucide.createIcons(); if (selfDestructSecs > 0) { div.dataset.destructing = "true"; setTimeout(() => { div.remove(); }, selfDestructSecs * 1000); } }
    function updateMessageTicks(msgId, status) { const ts = document.getElementById(`tick_${msgId}`); if (!ts) return; if (status === 'delivered') ts.innerHTML = '<i data-lucide="check-check" style="width:12px;"></i>'; else if (status === 'read') { ts.innerHTML = '<i data-lucide="check-check" style="width:12px; color:#34b7f1;"></i>'; } lucide.createIcons(); }

    const dragCard = document.getElementById('local-video-container'); let active = false, currentX=0, currentY=0, initialX, initialY, xOffset = 0, yOffset = 0; const startDrag = (e) => { initialX = (e.touches ? e.touches[0].clientX : e.clientX) - xOffset; initialY = (e.touches ? e.touches[0].clientY : e.clientY) - yOffset; active = true; }; const endDrag = () => { initialX = currentX; initialY = currentY; active = false; }; const doDrag = (e) => { if (active) { e.preventDefault(); currentX = (e.touches ? e.touches[0].clientX : e.clientX) - initialX; currentY = (e.touches ? e.touches[0].clientY : e.clientY) - initialY; xOffset = currentX; yOffset = currentY; dragCard.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`; } }; dragCard.addEventListener("touchstart", startDrag, {passive: false}); dragCard.addEventListener("touchend", endDrag); dragCard.addEventListener("touchmove", doDrag, {passive: false}); dragCard.addEventListener("mousedown", startDrag); window.addEventListener("mouseup", endDrag); window.addEventListener("mousemove", doDrag); lucide.createIcons();
  </script>
