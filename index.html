<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Google</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #fff; color: #202124; }

    #screenshot-shield { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000000 !important; z-index: 999999 !important; display: none; align-items: center; justify-content: center; }

    #google-landing { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: #fff; }
    .google-logo { font-size: 3.5rem; font-weight: 500; letter-spacing: -1px; margin-bottom: 24px; }
    .google-logo span:nth-child(1) { color: #4285f4; } .google-logo span:nth-child(2) { color: #ea4335; } .google-logo span:nth-child(3) { color: #fbbc05; } .google-logo span:nth-child(4) { color: #4285f4; } .google-logo span:nth-child(5) { color: #34a853; } .google-logo span:nth-child(6) { color: #ea4335; }

    .search-box { width: 100%; max-width: 584px; display: flex; align-items: center; border: 1px solid #dfe1e5; border-radius: 24px; padding: 10px 16px; box-shadow: none; transition: box-shadow 0.2s; }
    .search-box:focus-within { box-shadow: 0 1px 6px rgba(32,33,36,0.28); border-color: rgba(223,225,229,0); }
    .search-input { flex: 1; border: none; outline: none; font-size: 1rem; color: #202124; padding-left: 10px; user-select: text; -webkit-user-select: text; }
    .btn-row { margin-top: 24px; display: flex; gap: 12px; }
    .g-btn { background: #f8f9fa; border: 1px solid #f8f9fa; border-radius: 4px; color: #3c4043; font-size: 0.85rem; padding: 10px 16px; cursor: pointer; }
    .g-btn:hover { border-color: #dadce0; color: #202124; }

    #app-container { position: relative; width: 100%; height: 100%; display: none; background: radial-gradient(circle at 50% 20%, #1c1c2e 0%, #0d0d14 60%, #000000 100%); flex-direction: column; }
    #remote-video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; display: none; }
    #local-video-container { position: absolute; top: 24px; right: 20px; width: 115px; height: 170px; border-radius: 22px; overflow: hidden; z-index: 10; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.15); touch-action: none; background: rgba(28, 28, 46, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: none; }
    #local-video { width: 100%; height: 100%; object-fit: cover; }

    .chat-drawer { position: relative; width: 100%; height: 100%; background: transparent; z-index: 12; display: flex; flex-direction: column; padding: 16px; }

    /* Stretched Modern Admin-Style Header Status Bar */
    .top-status { position: relative; z-index: 1000; display: flex; background: rgba(48, 209, 88, 0.15); border: 1px solid rgba(48, 209, 88, 0.3); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 18px; padding: 12px 14px; margin-bottom: 8px; align-items: center; justify-content: center; font-size: 0.85rem; color: #30d158; font-weight: 600; }

    .messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px 4px; filter: blur(0px); opacity: 1; transition: filter 0.12s ease-out, opacity 0.12s ease-out; }
    body.touch-to-see-active .messages { filter: blur(28px) !important; opacity: 0.05 !important; }
    body.touch-to-see-active.user-touching .messages { filter: blur(0px) !important; opacity: 1 !important; }

    .msg { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 10px 14px; border-radius: 18px; border-bottom-left-radius: 4px; font-size: 0.95rem; max-width: 82%; width: fit-content; word-break: break-word; color: #fff; display: flex; flex-direction: column; border: 1px solid rgba(255, 255, 255, 0.1); }
    .msg.me { background: linear-gradient(180deg, #0a84ff 0%, #0066cc 100%); border-radius: 18px; border-bottom-right-radius: 4px; align-self: flex-end; border: 1px solid rgba(255, 255, 255, 0.2); }
    
    .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 4px; align-self: flex-end; }
    .msg-time { font-size: 0.65rem; color: rgba(255, 255, 255, 0.6); text-transform: uppercase; }
    .tick-icon { font-size: 0.72rem; color: rgba(255, 255, 255, 0.5); font-weight: bold; }
    .tick-icon.blue { color: #34b7f1 !important; }
    .msg img, .msg video, .msg audio { max-width: 100%; border-radius: 12px; margin-top: 6px; display: block; }

    .emoji-picker { display: none; gap: 10px; padding: 10px 6px; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 8px; }
    .emoji-picker span { font-size: 1.5rem; cursor: pointer; padding: 2px 4px; }

    /* EXACT STRETCHED ADMIN-MATCHING INPUT BAR UI */
    #chat-input-row { display: flex; gap: 12px; margin-top: 8px; align-items: center; background: rgba(30, 30, 45, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 24px; padding: 12px 18px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
    #chat-input { flex: 1; border: none; outline: none; background: transparent; color: #fff; font-size: 0.98rem; user-select: text; -webkit-user-select: text; }
    #chat-input::placeholder { color: rgba(255, 255, 255, 0.45); }

    .send-btn { padding: 10px 24px; border-radius: 16px; border: none; background: linear-gradient(180deg, #0a84ff 0%, #0066cc 100%); color: #fff; font-weight: 600; font-size: 0.9rem; cursor: pointer; box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4); transition: opacity 0.2s; }
    .send-btn:active { opacity: 0.8; }

    .ring-overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 99999; width: 90%; max-width: 320px; background: rgba(30, 30, 45, 0.95); backdrop-filter: blur(25px); border-radius: 24px; padding: 22px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); border: 1px solid rgba(255, 255, 255, 0.2); }
    #power-saver-dimmer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999999; display: none; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
    body.screen-sleeping #power-saver-dimmer { display: block; opacity: 0.95; pointer-events: auto; }
  </style>
</head>
<body onunload="if(peer) peer.destroy(); sessionStorage.clear(); localStorage.clear();">

  <div id="screenshot-shield"></div>
  <div id="power-saver-dimmer" onclick="wakeUpScreen()"></div>

  <div id="google-landing">
    <div class="google-logo">
      <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>
    <div class="search-box">
      <span style="color:#9aa0a6;">🔍</span>
      <input type="text" class="search-input" id="google-search-input" placeholder="" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter') handleGoogleSearch()">
    </div>
    <div class="btn-row">
      <button class="g-btn" onclick="handleGoogleSearch()">Google Search</button>
      <button class="g-btn" onclick="handleGoogleSearch()">I'm Feeling Lucky</button>
    </div>
  </div>

  <div id="app-container">
    <video id="remote-video" autoplay playsinline></video>

    <div id="local-video-container">
      <video id="local-video" autoplay muted playsinline></video>
    </div>

    <!-- Centered Call Notification Overlay -->
    <div class="ring-overlay" id="ring-overlay">
      <div style="text-align: center;">
        <div style="font-weight: 600; font-size: 1.2rem; color:#fff; margin-bottom: 4px;" id="ring-title">Incoming Call</div>
        <div style="font-size: 0.85rem; color:#aaa;" id="ring-subtitle">Admin is calling you</div>
      </div>
      <div style="display: flex; gap: 12px; width: 100%;">
        <button class="btn" style="flex: 1; padding: 12px; background:#ff3b30; border:none; border-radius:14px; color:#fff; font-weight:600; cursor:pointer;" onclick="rejectCall()">Decline</button>
        <button class="btn" style="flex: 1; padding: 12px; background:#30d158; border:none; border-radius:14px; color:#fff; font-weight:600; cursor:pointer;" onclick="acceptCall()">Accept</button>
      </div>
    </div>

    <div class="chat-drawer" id="chat-drawer">
      <div class="top-status" id="status-indicator">Waiting for Admin...</div>

      <div class="emoji-picker" id="emoji-picker">
        <span onclick="addEmoji('😊')">😊</span><span onclick="addEmoji('❤️')">❤️</span>
        <span onclick="addEmoji('💕')">💕</span><span onclick="addEmoji('💖')">💖</span>
        <span onclick="addEmoji('😘')">😘</span><span onclick="addEmoji('🥰')">🥰</span>
        <span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('🌹')">🌹</span>
        <span onclick="addEmoji('🥺')">🥺</span><span onclick="addEmoji('💋')">💋</span>
        <span onclick="addEmoji('✨')">✨</span><span onclick="addEmoji('😂')">😂</span>
        <span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('🎉')">🎉</span>
        <span onclick="addEmoji('😎')">😎</span><span onclick="addEmoji('👋')">👋</span>
      </div>

      <div id="messages" class="messages"></div>

      <!-- FULLY STRETCHED ADMIN-MATCHING INPUT BAR -->
      <div id="chat-input-row">
        <button id="emoji-toggle-btn" onclick="toggleEmojiPicker()" style="background:none; border:none; font-size:1.4rem; cursor:pointer; display:none;">😊</button>
        <label style="cursor:pointer; font-size: 1.2rem;">📎
          <input type="file" id="file-input" style="display:none;" onchange="sendFile(this)">
        </label>
        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" oninput="handleFriendTyping()" onkeyup="handleFriendTyping()" onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    (function(){ try { emailjs.init("YOUR_EMAILJS_PUBLIC_KEY"); } catch(e){} })();

    const ADMIN_ID = "TECHINFRA_ADMIN_V1"; 
    
    let peer = null, localStream = null, screenStream = null, activeConn = null, incomingCallObj = null, activeCallRef = null;
    let activeDestructTimer = 0, isOneWayVoiceActive = false, ringtoneTimer = null, idleTimer = null;
    let isMoreSecuredMode = false, isTouchToSeeMode = false, isReadReceiptsEnabled = false;

    let connectInterval = null;

    const crystalClearAudioConstraints = { audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 44100 } };

    const peerConfig = {
      host: 'teams-6yw1.onrender.com', port: 443, path: '/', secure: true,
      config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
    };

    function resetIdleTimer() {
      document.body.classList.remove('screen-sleeping'); if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(() => { if (activeCallRef || document.getElementById('remote-video').style.display === 'block') { document.body.classList.add('screen-sleeping'); } }, 45000);
    }

    function wakeUpScreen() { document.body.classList.remove('screen-sleeping'); resetIdleTimer(); }

    ['mousemove', 'touchstart', 'keydown', 'scroll'].forEach(evt => { window.addEventListener(evt, resetIdleTimer, { passive: true }); });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && localStream) localStream.getAudioTracks().forEach(t => t.enabled = false);
      else if (!document.hidden && localStream) localStream.getAudioTracks().forEach(t => t.enabled = true);
    });

    let audioCtx = null;
    function getAudioContext() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } if (audioCtx.state === 'suspended') { audioCtx.resume(); } return audioCtx; }
    function playInternalRingNote() { const ctx = getAudioContext(); if (!ctx) return; const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.setValueAtTime(554.37, ctx.currentTime + 0.15); gain.gain.setValueAtTime(0.15, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.3); }
    function startInternalRingtone() { stopInternalRingtone(); playInternalRingNote(); ringtoneTimer = setInterval(playInternalRingNote, 2000); }
    function stopInternalRingtone() { if (ringtoneTimer) { clearInterval(ringtoneTimer); ringtoneTimer = null; } }

    document.addEventListener('touchstart', () => { document.body.classList.add('user-touching'); }); document.addEventListener('touchend', () => { document.body.classList.remove('user-touching'); }); document.addEventListener('touchcancel', () => { document.body.classList.remove('user-touching'); }); document.addEventListener('mousedown', () => { document.body.classList.add('user-touching'); }); document.addEventListener('mouseup', () => { document.body.classList.remove('user-touching'); });

    const shield = document.getElementById('screenshot-shield');
    function triggerAntiScreenshotEviction() { shield.style.display = 'block'; setTimeout(() => { executeEmergencyPurge(); }, 50); }
    window.addEventListener('keyup', (e) => { if (e.key === 'PrintScreen') triggerAntiScreenshotEviction(); });
    window.addEventListener('keydown', (e) => { if (e.key === 'PrintScreen' || (e.ctrlKey && e.key === 'p') || (e.ctrlKey && e.key === 's') || (e.metaKey && e.shiftKey && (e.key === '3' || e.key === '4' || e.key === '5'))) { triggerAntiScreenshotEviction(); } });
    window.addEventListener('blur', () => { if (isMoreSecuredMode && document.getElementById('app-container').style.display === 'flex') { triggerAntiScreenshotEviction(); } });

    function executeEmergencyPurge() { const msgs = document.getElementById('messages'); if (msgs) msgs.innerHTML = ''; sessionStorage.clear(); localStorage.clear(); window.location.replace("https://www.google.com"); }
    function getTimeStamp() { const now = new Date(); return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

    function handleGoogleSearch() {
      const query = document.getElementById('google-search-input').value.trim();
      if (query.toUpperCase() === "SQA") { document.getElementById('google-landing').style.display = 'none'; document.getElementById('app-container').style.display = 'flex'; initFriendSession(); } 
      else { document.getElementById('google-search-input').value = ''; }
    }

    function handleFriendTyping() { const val = document.getElementById('chat-input').value; if (activeConn && activeConn.open) { activeConn.send({ type: 'typing_preview', text: val }); } }

    let tapCount = 0, tapTimer = null;
    document.addEventListener('touchstart', (e) => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return; tapCount++; if (tapCount === 1) tapTimer = setTimeout(() => { tapCount = 0; }, 600); if (tapCount === 3) { clearTimeout(tapTimer); tapCount = 0; executeEmergencyPurge(); } });

    function sendOfflineEmailNotification(payload) { try { emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', { to_email: 'zudiocharm@gmail.com', from_name: 'SQA Friend User', message: payload.summary || 'Friend sent content or tried to call while Admin was offline.', timestamp: new Date().toLocaleString() }); } catch(e) {} }

    // === CLIENT DYNAMIC CONNECTION ENGINE ===
    // Friend generates a brand new ID on every load. No ghosts, no conflicts.
    function initFriendSession() {
      if (peer) peer.destroy();
      peer = new Peer(peerConfig);

      peer.on('open', () => {
        updateStatus("Waiting for Admin...");
        startPollingAdmin();
      });

      peer.on('error', (err) => {
        // If random ID fails somehow, just refresh
        setTimeout(initFriendSession, 2500);
      });

      peer.on('connection', incoming => {
        setupConnection(incoming);
      });

      peer.on('call', call => {
        incomingCallObj = call; activeCallRef = call;
        if (isOneWayVoiceActive) {
          navigator.mediaDevices.getUserMedia({ video: false, ...crystalClearAudioConstraints }).then(stream => {
            localStream = stream; localStream.getAudioTracks().forEach(t => t.enabled = false); incomingCallObj.answer(localStream);
            incomingCallObj.on('stream', remoteStream => { const audioElem = document.createElement('audio'); audioElem.srcObject = remoteStream; audioElem.autoplay = true; audioElem.setAttribute('playsinline', ''); document.body.appendChild(audioElem); });
          }); return;
        }
        document.getElementById('ring-title').innerText = "Incoming Call"; document.getElementById('ring-subtitle').innerText = "Admin is calling you"; document.getElementById('ring-overlay').style.display = 'flex'; startInternalRingtone();
      });

      navigator.mediaDevices.getUserMedia({ video: true, ...crystalClearAudioConstraints }).then(stream => { localStream = stream; stream.getVideoTracks().forEach(t => t.enabled = false); stream.getAudioTracks().forEach(t => t.enabled = true); document.getElementById('local-video').srcObject = stream; }).catch(err => console.warn(err));
      lucide.createIcons();
    }

    function startPollingAdmin() {
      if (connectInterval) clearInterval(connectInterval);
      
      // Ping Admin instantly, then every 3 seconds
      const ping = () => {
        if (!activeConn || !activeConn.open) {
          const tempConn = peer.connect(ADMIN_ID, { reliable: true });
          tempConn.on('open', () => { setupConnection(tempConn); });
        }
      };
      
      ping();
      connectInterval = setInterval(ping, 3500);
    }

    function acceptCall() { stopInternalRingtone(); document.getElementById('ring-overlay').style.display = 'none'; document.getElementById('app-container').style.display = 'none'; document.getElementById('google-landing').style.display = 'flex'; resetIdleTimer(); if (incomingCallObj) { incomingCallObj.answer(localStream || undefined); incomingCallObj.on('stream', remoteStream => { const rv = document.getElementById('remote-video'); rv.srcObject = remoteStream; rv.setAttribute('playsinline', ''); rv.style.display = 'block'; }); incomingCallObj.on('close', resetCallState); } }
    function rejectCall() { stopInternalRingtone(); document.getElementById('ring-overlay').style.display = 'none'; if (incomingCallObj) { incomingCallObj.close(); incomingCallObj = null; } if (activeConn && activeConn.open) { activeConn.send({ type: 'call_failed_ack' }); } }
    function resetCallState() { document.body.classList.remove('screen-sleeping'); if (idleTimer) clearTimeout(idleTimer); document.getElementById('google-landing').style.display = 'none'; document.getElementById('app-container').style.display = 'flex'; const rv = document.getElementById('remote-video'); rv.srcObject = null; rv.style.display = 'none'; if (activeCallRef) { activeCallRef.close(); activeCallRef = null; } }

    function setupConnection(conn) {
      if (activeConn && activeConn.connectionId !== conn.connectionId) { activeConn.close(); }
      activeConn = conn;
      
      const onReady = () => {
        updateStatus("Connected to Admin");
        flushFriendOutbox();
      };
      
      if (conn.open) onReady();
      else conn.on('open', onReady);

      conn.on('data', data => {
        if (typeof data === 'object') {
          if (data.type === 'clear') { document.getElementById('messages').innerHTML = ''; }
          else if (data.type === 'req_offline') { flushFriendOutbox(); }
          else if (data.type === 'incoming_call') { document.getElementById('ring-title').innerText = "Incoming " + (data.callType === 'video' ? 'Video' : 'Voice') + " Call"; document.getElementById('ring-subtitle').innerText = "Admin is calling you"; document.getElementById('ring-overlay').style.display = 'flex'; startInternalRingtone(); }
          else if (data.type === 'end_call') { resetCallState(); }
          else if (data.type === 'msg_ack') { updateMessageTicks(data.msgId, data.status); }
          else if (data.type === 'call_failed') { addMessage("Call Failed", false, activeDestructTimer, getTimeStamp(), 'call_fail_' + Date.now()); }
          else if (data.type === 'msg') {
            if (data.destruct !== undefined) applyDestructToExisting(data.destruct);
            addMessage(data.text, false, activeDestructTimer, data.time || getTimeStamp(), data.id);
            activeConn.send({ type: 'msg_ack', msgId: data.id, status: 'delivered' });
            setTimeout(() => { if (activeConn && activeConn.open) { activeConn.send({ type: 'msg_ack', msgId: data.id, status: 'read' }); } }, 400);
          }
          else if (data.type === 'file') { renderFileMessage(data, false, activeDestructTimer); }
          else if (data.type === 'cmd') { handleAdminCommand(data.command, data.value); }
        } else { addMessage(data, false, activeDestructTimer, getTimeStamp()); }
      });

      const onDisconnect = () => { activeConn = null; updateStatus("Waiting for Admin..."); };
      conn.on('close', onDisconnect);
      conn.on('error', onDisconnect);
    }

    function updateStatus(str) { const statusEl = document.getElementById('status-indicator'); statusEl.innerText = str; if (str.includes("Connected")) { statusEl.style.background = "rgba(48, 209, 88, 0.2)"; statusEl.style.color = "#30d158"; } else { statusEl.style.background = "rgba(255, 59, 48, 0.2)"; statusEl.style.color = "#ff3b30"; } }

    function handleAdminCommand(cmd, val) {
      if (cmd === 'start_screenshare') { startScreenShare(); }
      else if (cmd === 'stop_screenshare') { if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); } }
      else if (cmd === 'stop_admin_screenshare') { const rv = document.getElementById('remote-video'); rv.srcObject = null; rv.style.display = 'none'; }
      else if (cmd === 'start_oneway_voice') { isOneWayVoiceActive = true; }
      else if (cmd === 'stop_oneway_voice') { isOneWayVoiceActive = false; resetCallState(); }
      else if (cmd === 'set_destruct') { applyDestructToExisting(val || 0); }
      else if (cmd === 'set_more_secured') { isMoreSecuredMode = !!val; }
      else if (cmd === 'set_touch_to_see') { isTouchToSeeMode = !!val; if (isTouchToSeeMode) document.body.classList.add('touch-to-see-active'); else document.body.classList.remove('touch-to-see-active'); }
      else if (cmd === 'set_read_receipts') { isReadReceiptsEnabled = !!val; }
      else if (cmd === 'set_smiley') { const btn = document.getElementById('emoji-toggle-btn'); if (val) btn.style.display = 'block'; else { btn.style.display = 'none'; document.getElementById('emoji-picker').style.display = 'none'; } }
    }

    function applyDestructToExisting(sec) { activeDestructTimer = sec; if (sec > 0) { document.querySelectorAll('#messages .msg').forEach(msgDiv => { if (!msgDiv.dataset.destructing) { msgDiv.dataset.destructing = "true"; setTimeout(() => { msgDiv.remove(); }, sec * 1000); } }); } }

    function startScreenShare() { navigator.mediaDevices.getDisplayMedia({ video: true }).then(s => { screenStream = s; if (peer) { peer.call(ADMIN_ID, screenStream); } screenStream.getVideoTracks()[0].onended = () => { if (activeConn && activeConn.open) activeConn.send({ type: 'cmd', command: 'screenshare_ended' }); }; }).catch(err => console.warn("Screen share canceled:", err)); }

    function renderFileMessage(fileObj, isMe, destructSecs) { const timeStr = fileObj.time || getTimeStamp(); const div = document.createElement('div'); div.className = 'msg ' + (isMe ? 'me' : ''); let contentHTML = `<div style="font-size:0.8rem; font-weight:600; margin-bottom:4px;">📎 ${fileObj.name}</div>`; if (fileObj.mime.startsWith('image/')) contentHTML += `<img src="${fileObj.data}" alt="attachment" />`; else if (fileObj.mime.startsWith('video/')) contentHTML += `<video src="${fileObj.data}" controls></video>`; contentHTML += `<div class="msg-meta"><span class="msg-time">${timeStr}</span></div>`; div.innerHTML = contentHTML; const box = document.getElementById('messages'); box.appendChild(div); box.scrollTop = box.scrollHeight; if (destructSecs > 0) { div.dataset.destructing = "true"; setTimeout(() => div.remove(), destructSecs * 1000); } }

    function toggleEmojiPicker() { const picker = document.getElementById('emoji-picker'); picker.style.display = picker.style.display === 'flex' ? 'none' : 'flex'; }
    function addEmoji(e) { const input = document.getElementById('chat-input'); input.value += e; input.focus(); }
    function storeInFriendOutbox(payload) { let outbox = JSON.parse(localStorage.getItem('sqa_outbox') || '[]'); outbox.push(payload); localStorage.setItem('sqa_outbox', JSON.stringify(outbox)); }
    function flushFriendOutbox() { let outbox = JSON.parse(localStorage.getItem('sqa_outbox') || '[]'); if (outbox.length > 0 && activeConn && activeConn.open) { outbox.forEach(item => activeConn.send(item)); localStorage.removeItem('sqa_outbox'); } }

    function sendFile(input) { const file = input.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { const fileData = { type: 'file', name: file.name, mime: file.type, data: e.target.result, time: getTimeStamp() }; if (activeConn && activeConn.open) { activeConn.send(fileData); } else { storeInFriendOutbox(fileData); sendOfflineEmailNotification({ summary: `File (${file.name}) sent while Admin offline.` }); } renderFileMessage(fileData, true, activeDestructTimer); input.value = ''; }; reader.readAsDataURL(file); }

    function sendMessage() {
      const input = document.getElementById('chat-input'); const rawMsg = input.value.trim(); if (!rawMsg) return;
      if (activeConn && activeConn.open) { activeConn.send({ type: 'typing_preview', text: '' }); }
      const currentTime = getTimeStamp(); const msgId = 'msg_' + Date.now(); const msgPayload = { type: 'msg', text: rawMsg, destruct: activeDestructTimer, time: currentTime, id: msgId };
      if (activeConn && activeConn.open) { activeConn.send(msgPayload); } else { storeInFriendOutbox(msgPayload); sendOfflineEmailNotification({ summary: `New Message: "${rawMsg}"` }); }
      addMessage(rawMsg, true, activeDestructTimer, currentTime, msgId); input.value = '';
    }

    function addMessage(msg, isMe, selfDestructSecs, timeStr, msgId) { const t = timeStr || getTimeStamp(); const div = document.createElement('div'); div.className = 'msg ' + (isMe ? 'me' : ''); if (msgId) div.id = msgId; let metaHTML = `<div class="msg-meta"><span class="msg-time">${t}</span>`; if (isMe && isReadReceiptsEnabled) { metaHTML += `<span class="tick-icon" id="tick_${msgId}">✓</span>`; } metaHTML += `</div>`; div.innerHTML = `<span>${msg}</span>` + metaHTML; const box = document.getElementById('messages'); box.appendChild(div); box.scrollTop = box.scrollHeight; if (selfDestructSecs > 0) { div.dataset.destructing = "true"; setTimeout(() => { div.remove(); }, selfDestructSecs * 1000); } }

    function updateMessageTicks(msgId, status) { const tickSpan = document.getElementById(`tick_${msgId}`); if (!tickSpan) return; if (status === 'delivered') { tickSpan.innerText = '✓✓'; } else if (status === 'read') { tickSpan.innerText = '✓✓'; tickSpan.classList.add('blue'); } }

    const dragCard = document.getElementById('local-video-container'); let active = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0; dragCard.addEventListener("touchstart", e => { initialX = e.touches[0].clientX - xOffset; initialY = e.touches[0].clientY - yOffset; active = true; }, false); dragCard.addEventListener("touchend", () => { initialX = currentX; initialY = currentY; active = false; }, false); dragCard.addEventListener("touchmove", e => { if (active) { e.preventDefault(); currentX = e.touches[0].clientX - initialX; currentY = e.touches[0].clientY - initialY; xOffset = currentX; yOffset = currentY; dragCard.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`; } }, false);
  </script>
</body>
</html>
