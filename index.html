  <script>
    (function(){ try { emailjs.init("YOUR_EMAILJS_PUBLIC_KEY"); } catch(e){} })();

    const ADMIN_ID = "TECHINFRA_ADMIN_V1"; 
    
    let peer = null, localStream = null, activeConn = null, incomingCallObj = null, activeCallRef = null;
    let activeDestructTimer = 0, ringtoneTimer = null;
    let currentCallType = 'voice', callDurationTimer = null, callSeconds = 0;
    let isCallMuted = false, isCamOff = false, isSpeakerOn = true;
    let connectInterval = null;

    let heartbeatInterval = null, heartbeatCheckInterval = null, lastPingReceived = 0;
    let activeReactionMsgId = null;
    let isAnsweringCall = false;

    const voiceOnlyConstraints = { video: false, audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } };
    const videoCallConstraints = { video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } };

    // HIGH-AVAILABILITY MULTI-STUN WEBRTC CONFIG FOR CROSS-PLATFORM MOBILES
    const peerConfig = { 
      host: 'teams-6yw1.onrender.com', port: 443, path: '/', secure: true, 
      config: { 
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' }
        ] 
      } 
    };

    let audioCtx = null;
    function getAudioContext() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } if (audioCtx.state === 'suspended') { audioCtx.resume(); } return audioCtx; }
    function playToneNote(freq, type, duration, delay = 0, vol = 0.3) { const ctx = getAudioContext(); setTimeout(() => { if (!ctx) return; const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime); gain.gain.setValueAtTime(vol, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + duration); }, delay); }
    function playMessageAlertSound() { playToneNote(1200, 'sine', 0.05, 0, 0.4); }
    function playInternalRingNote() { playToneNote(440, 'sine', 0.15, 0, 0.15); playToneNote(554.37, 'sine', 0.15, 150, 0.15); }
    function startInternalRingtone() { stopInternalRingtone(); playInternalRingNote(); ringtoneTimer = setInterval(playInternalRingNote, 2000); }
    function stopInternalRingtone() { if (ringtoneTimer) { clearInterval(ringtoneTimer); ringtoneTimer = null; } }

    function getTimeStamp() { const now = new Date(); return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
    function handleKeyInput(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }

    function handleGoogleSearch() {
      const query = document.getElementById('google-search-input').value.trim();
      if (query.toUpperCase() === "SQA") { document.getElementById('google-landing').style.display = 'none'; document.getElementById('app-container').style.display = 'flex'; lucide.createIcons(); initFriendSession(); } 
      else { document.getElementById('google-search-input').value = ''; }
    }

    function openReactionBar(msgId, e) {
      e.stopPropagation(); activeReactionMsgId = msgId;
      const bar = document.getElementById('reaction-bar'); bar.style.display = 'flex';
      const rect = e.currentTarget.getBoundingClientRect();
      bar.style.top = (rect.top - 40) + 'px';
      bar.style.left = Math.min(Math.max(rect.left + (rect.width/2), 100), window.innerWidth - 100) + 'px';
    }
    function closeReactionBar() { document.getElementById('reaction-bar').style.display = 'none'; activeReactionMsgId = null; }
    function sendReaction(emoji, e) {
      e.stopPropagation(); if(!activeReactionMsgId) return;
      applyReaction(activeReactionMsgId, emoji);
      const payload = { type: 'reaction', msgId: activeReactionMsgId, emoji: emoji };
      if (activeConn && activeConn.open) { activeConn.send(payload); }
      closeReactionBar();
    }
    function applyReaction(msgId, emoji) {
      const msgDiv = document.getElementById(msgId); if(!msgDiv) return;
      let rContainer = msgDiv.querySelector('.reactions-container');
      if(!rContainer) { rContainer = document.createElement('div'); rContainer.className = 'reactions-container'; msgDiv.appendChild(rContainer); }
      rContainer.innerHTML = `<span>${emoji}</span>`;
    }

    function handleMessageClick(msgId, isMe, e) {
      if (!isMe) { openReactionBar(msgId, e); return; }
      let action = prompt("Choose action:\n1. Edit message\n2. React with emoji", "1");
      if (action === "1") {
        let msgDiv = document.getElementById(msgId);
        let textSpan = msgDiv.querySelector('.msg-text');
        let oldText = textSpan ? textSpan.innerText : "";
        let newText = prompt("Edit your message:", oldText);
        if (newText !== null && newText.trim() !== "") {
          updateEditedMessage(msgId, newText, true);
          if (activeConn && activeConn.open) { activeConn.send({ type: 'edit_msg', msgId: msgId, text: newText }); }
        }
      } else { openReactionBar(msgId, e); }
    }
    function updateEditedMessage(msgId, newText, isMe) {
      let msgDiv = document.getElementById(msgId); if (!msgDiv) return;
      let textSpan = msgDiv.querySelector('.msg-text');
      if (textSpan) {
        textSpan.innerText = newText;
        let editedTag = msgDiv.querySelector('.edited-tag');
        if (!editedTag) {
          let meta = msgDiv.querySelector('.msg-meta');
          let tag = document.createElement('span'); tag.className = 'edited-tag'; tag.style.cssText = "font-size:0.65rem; opacity:0.6; margin-right:4px;"; tag.innerText = "(edited)";
          meta.insertBefore(tag, meta.firstChild);
        }
      }
    }

    function handleFriendTyping() { const val = document.getElementById('chat-input').value; if (activeConn && activeConn.open) { activeConn.send({ type: 'typing_preview', text: val }); } }

    /* MS TEAMS CALL CONTROLS FOR FRIEND */
    function toggleTeamsMic() {
      if (!localStream) return; isCallMuted = !isCallMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !isCallMuted);
      const btn = document.getElementById('call-mic-btn');
      btn.innerHTML = isCallMuted ? `<i data-lucide="mic-off"></i>` : `<i data-lucide="mic"></i>`;
      document.getElementById('mic-lbl').innerText = isCallMuted ? "Mic Off" : "Mic On";
      isCallMuted ? btn.classList.add('active-off') : btn.classList.remove('active-off');
      lucide.createIcons();
    }

    function toggleTeamsCam() {
      if (!localStream || currentCallType !== 'video') return; isCamOff = !isCamOff;
      localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
      const btn = document.getElementById('call-cam-btn');
      btn.innerHTML = isCamOff ? `<i data-lucide="camera-off"></i>` : `<i data-lucide="camera"></i>`;
      document.getElementById('cam-lbl').innerText = isCamOff ? "Video Off" : "Video On";
      document.getElementById('local-video').style.opacity = isCamOff ? "0" : "1";
      isCamOff ? btn.classList.add('active-off') : btn.classList.remove('active-off');
      lucide.createIcons();
    }

    function toggleSpeakerOutput() {
      isSpeakerOn = !isSpeakerOn;
      const ra = document.getElementById('remote-audio');
      if (ra) ra.muted = !isSpeakerOn;
      const btn = document.getElementById('call-speaker-btn');
      btn.innerHTML = isSpeakerOn ? `<i data-lucide="volume-2"></i>` : `<i data-lucide="volume-x"></i>`;
      isSpeakerOn ? btn.classList.remove('active-off') : btn.classList.add('active-off');
      lucide.createIcons();
    }

    function toggleLocalVideoVisibility() {
      const container = document.getElementById('local-video-container');
      container.style.display = (container.style.display === 'none') ? 'block' : 'none';
    }

    function startCallTimer() {
      callSeconds = 0; if (callDurationTimer) clearInterval(callDurationTimer);
      document.getElementById('call-duration').innerText = "00:00";
      callDurationTimer = setInterval(() => {
        callSeconds++;
        const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const s = String(callSeconds % 60).padStart(2, '0');
        document.getElementById('call-duration').innerText = `${m}:${s}`;
      }, 1000);
    }

    function showCallUI(type, isCaller) {
      document.getElementById('call-ui').style.display = 'flex';
      const audioStage = document.getElementById('audio-only-ui');
      const remoteVideo = document.getElementById('remote-video');
      const localContainer = document.getElementById('local-video-container');

      if (type === 'video') {
        remoteVideo.style.display = 'block'; audioStage.style.display = 'none'; localContainer.style.display = 'block';
        document.getElementById('cam-lbl').innerText = "Video On";
        document.getElementById('call-cam-btn').classList.remove('active-off');
        document.getElementById('call-cam-btn').innerHTML = `<i data-lucide="camera"></i>`;
      } else {
        remoteVideo.style.display = 'none'; audioStage.style.display = 'flex'; localContainer.style.display = 'none';
        document.getElementById('cam-lbl').innerText = "Video Off";
        document.getElementById('call-cam-btn').classList.add('active-off');
        document.getElementById('call-cam-btn').innerHTML = `<i data-lucide="camera-off"></i>`;
      }
      
      document.getElementById('call-ui-subtext').innerText = isCaller ? "Calling..." : "Connecting...";
      isCallMuted = false; isCamOff = (type !== 'video');
      lucide.createIcons();
    }

    function dialVoiceCall() {
      if (!activeConn || !activeConn.open) return alert('Offline!');
      currentCallType = 'voice'; getAudioContext();
      navigator.mediaDevices.getUserMedia(voiceOnlyConstraints).then(stream => {
        localStream = stream;
        activeCallRef = peer.call(ADMIN_ID, localStream, { metadata: { type: 'voice' } }); 
        setupCallHandlers(activeCallRef, 'voice'); showCallUI('voice', true);
      }).catch(err => { alert("Microphone access required."); });
    }

    function dialVideoCall() {
      if (!activeConn || !activeConn.open) return alert('Offline!');
      currentCallType = 'video'; getAudioContext();
      navigator.mediaDevices.getUserMedia(videoCallConstraints).then(stream => {
        localStream = stream; document.getElementById('local-video').srcObject = stream;
        activeCallRef = peer.call(ADMIN_ID, localStream, { metadata: { type: 'video' } }); 
        setupCallHandlers(activeCallRef, 'video'); showCallUI('video', true);
      }).catch(err => { alert("Camera access required."); });
    }

    function setupCallHandlers(callObj, type) {
      callObj.on('stream', remoteStream => {
        const rv = document.getElementById('remote-video'); 
        const ra = document.getElementById('remote-audio');
        
        if (type === 'video') { 
          rv.srcObject = remoteStream; rv.muted = true; rv.play().catch(e=>{});
          rv.style.display = 'block'; document.getElementById('audio-only-ui').style.display = 'none';
        } else { rv.srcObject = null; }
        
        ra.srcObject = remoteStream; ra.muted = false; ra.play().catch(e=>{});
        document.getElementById('call-ui-subtext').innerText = "Connected";
        startCallTimer();
      });
      callObj.on('close', endTeamsCall); callObj.on('error', endTeamsCall);
    }

    function acceptCall() {
      getAudioContext(); stopInternalRingtone();
      document.getElementById('ring-overlay').style.display = 'none';
      isAnsweringCall = true;
      const constraints = currentCallType === 'video' ? videoCallConstraints : voiceOnlyConstraints;
      navigator.mediaDevices.getUserMedia(constraints).then(stream => { 
        localStream = stream; 
        if(currentCallType === 'video') document.getElementById('local-video').srcObject = stream; 
        showCallUI(currentCallType, false); 
        if (incomingCallObj) { 
          incomingCallObj.answer(localStream); 
          setupCallHandlers(incomingCallObj, currentCallType); 
          isAnsweringCall = false;
        } 
      }).catch(err => { alert("Permissions denied."); rejectCall(); });
    }

    function rejectCall() { stopInternalRingtone(); document.getElementById('ring-overlay').style.display = 'none'; isAnsweringCall = false; if (incomingCallObj) { incomingCallObj.close(); incomingCallObj = null; } }

    function endTeamsCall() {
      if (activeCallRef) { activeCallRef.close(); activeCallRef = null; }
      if (incomingCallObj) { incomingCallObj.close(); incomingCallObj = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      document.getElementById('call-ui').style.display = 'none';
      document.getElementById('remote-video').srcObject = null; document.getElementById('remote-audio').srcObject = null; document.getElementById('local-video').srcObject = null;
      if(callDurationTimer) clearInterval(callDurationTimer);
      if(activeConn && activeConn.open) activeConn.send({ type: 'end_call' });
      isAnsweringCall = false;
    }

    function initFriendSession() {
      if (peer) peer.destroy(); peer = new Peer(peerConfig);
      peer.on('open', () => { updateConnectionStatus(false); startPollingAdmin(); });
      peer.on('error', (err) => { setTimeout(initFriendSession, 2000); });
      peer.on('connection', incoming => { setupConnection(incoming); });
      
      // DIRECT WEBRTC CALL HANDSHAKE FOR FRIEND PAGE
      peer.on('call', call => {
        incomingCallObj = call; activeCallRef = call; currentCallType = (call.metadata && call.metadata.type) ? call.metadata.type : 'voice';
        if (isAnsweringCall && localStream) {
          call.answer(localStream); setupCallHandlers(call, currentCallType); isAnsweringCall = false;
        } else {
          document.getElementById('ring-title').innerText = "Incoming " + (currentCallType === 'video' ? 'Video' : 'Audio') + " Call"; 
          document.getElementById('ring-overlay').style.display = 'flex'; startInternalRingtone();
        }
      });
    }

    function startPollingAdmin() {
      if (connectInterval) clearInterval(connectInterval);
      const ping = () => { if (!activeConn || !activeConn.open) { const tempConn = peer.connect(ADMIN_ID, { reliable: true }); tempConn.on('open', () => { setupConnection(tempConn); }); } };
      ping(); connectInterval = setInterval(ping, 3500);
    }

    function setupConnection(conn) {
      if (activeConn && activeConn.connectionId !== conn.connectionId) { activeConn.close(); } activeConn = conn;
      
      const onReady = () => { updateConnectionStatus(true); };
      if (conn.open) onReady(); else conn.on('open', onReady);

      conn.on('data', data => {
        if (typeof data === 'object') {
          if (data.type === 'clear') { document.getElementById('messages').innerHTML = ''; }
          else if (data.type === 'end_call') { endTeamsCall(); }
          else if (data.type === 'reaction') { applyReaction(data.msgId, data.emoji); }
          else if (data.type === 'edit_msg') { updateEditedMessage(data.msgId, data.text, false); }
          else if (data.type === 'cmd') { handleAdminCommand(data.command, data.value); }
          else if (data.type === 'file') { playMessageAlertSound(); renderFileMessage(data, false); }
          else if (data.type === 'msg') {
            document.getElementById('typing-indicator-box').style.display = 'none'; playMessageAlertSound();
            addMessage(data.text, false, data.time || getTimeStamp(), data.id);
          }
        } else { playMessageAlertSound(); addMessage(data, false, getTimeStamp()); }
      });
      
      const onDisconnect = () => { activeConn = null; updateConnectionStatus(false); };
      conn.on('close', onDisconnect); conn.on('error', onDisconnect);
    }

    function updateConnectionStatus(isOnline) {
      const sendBtn = document.getElementById('send-btn-icon');
      if (isOnline) { sendBtn.classList.add('online'); } else { sendBtn.classList.remove('online'); }
    }

    function handleAdminCommand(cmd, val) {
      if (cmd === 'set_header_visibility') {
        const headerBox = document.getElementById('friend-header-box');
        if (val) headerBox.style.display = 'flex'; else headerBox.style.display = 'none';
      }
      else if (cmd === 'set_friend_call_access') {
        const callBtns = document.getElementById('friend-call-buttons');
        if(val) callBtns.style.display = 'flex'; else callBtns.style.display = 'none';
      }
    }

    function sendFile(input) { 
      const file = input.files[0]; if (!file) return; 
      const reader = new FileReader(); reader.onload = function(e) { 
        const msgId = 'msg_f_' + Date.now();
        const fileData = { type: 'file', name: file.name, mime: file.type, data: e.target.result, time: getTimeStamp(), id: msgId }; 
        if (activeConn && activeConn.open) { activeConn.send(fileData); } 
        renderFileMessage(fileData, true); input.value = ''; 
      }; 
      reader.readAsDataURL(file); 
    }

    function sendMessage() {
      const input = document.getElementById('chat-input'); const rawMsg = input.value.trim(); if (!rawMsg) return;
      if (activeConn && activeConn.open) { activeConn.send({ type: 'typing_preview', text: '' }); }
      const currentTime = getTimeStamp(); const msgId = 'msg_' + Date.now(); const msgPayload = { type: 'msg', text: rawMsg, time: currentTime, id: msgId };
      if (activeConn && activeConn.open) { activeConn.send(msgPayload); }
      addMessage(rawMsg, true, currentTime, msgId); input.value = ''; input.style.height = 'auto';
    }

    function addMessage(msg, isMe, timeStr, msgId) { 
      const t = timeStr || getTimeStamp(); const div = document.createElement('div'); div.className = 'msg ' + (isMe ? 'me' : ''); 
      if (msgId) { div.id = msgId; div.setAttribute('onclick', `handleMessageClick('${msgId}', ${isMe}, event)`); }
      let metaHTML = `<div class="msg-meta"><span class="msg-time">${t}</span></div>`; 
      div.innerHTML = `<span class="msg-text">${msg}</span>` + metaHTML; 
      const box = document.getElementById('messages'); box.appendChild(div); box.scrollTop = box.scrollHeight; lucide.createIcons(); 
    }
  </script>
</body>
